
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTEGUMENTS — Soho</title>
<style>
*{box-sizing:border-box}
html{background:#000;scroll-behavior:smooth}
body{margin:0;background:#000;color:#a90000;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}

/* LOGO */
.site-logo{
  position:fixed;top:42px;right:34px;width:220px;
  z-index:2000;display:block;transition:opacity 350ms ease;
}
.site-logo img{display:block;width:100%;height:auto}
.site-logo.return-hidden{opacity:0;pointer-events:none}

/* OPENING */
.opening{
  position:relative;height:115vh;min-height:780px;background:#000;
}
.korean-group,.english-group{
  position:absolute;left:15.3%;opacity:1;
  pointer-events:auto;will-change:opacity;
}
.korean-group{
  top:calc(100vh - 145px);width:min(315px,76vw);
}
.english-group{
  top:calc(100vh + 12px);width:min(350px,76vw);
}

/* EXACT ENGLISH BRIGHTNESS FROM PAGE2-6 */
.english-group .text-motion{
  filter:brightness(1.55) saturate(1.25);
}

/* TEXT AND HOVER ECHO */
.text-motion{
  position:relative;width:100%;isolation:isolate;
}
.text-original{
  position:relative;z-index:10;display:block;width:100%;height:auto;
}
.text-echo{
  position:absolute;inset:0;z-index:5;display:block;
  width:100%;height:auto;pointer-events:none;
  opacity:0;transform:translate(0,0);
  transition:opacity 750ms ease-in-out;
  animation:echoDrift 4.4s ease-in-out infinite alternate;
  animation-play-state:paused;
  filter:drop-shadow(0 0 4px rgba(230,0,0,.58))
         drop-shadow(0 0 8px rgba(180,0,0,.22));
}
.english-group:hover .text-echo{
  opacity:.82;animation-play-state:running;
}
@keyframes echoDrift{
  0%{transform:translate(5px,3px)}
  50%{transform:translate(14px,-5px)}
  100%{transform:translate(7px,8px)}
}
.korean-group .text-echo{
  animation:echoDriftKorean 6s ease-in-out infinite alternate;
  animation-play-state:paused;
  filter:drop-shadow(0 0 3px rgba(230,0,0,.42))
         drop-shadow(0 0 6px rgba(180,0,0,.15));
}
.korean-group:hover .text-echo{
  opacity:.65;animation-play-state:running;
}
@keyframes echoDriftKorean{
  0%{transform:translate(3px,2px)}
  50%{transform:translate(7px,-2px)}
  100%{transform:translate(4px,4px)}
}

/* FILM */
.film-section{
  position:relative;height:72vh;height:72dvh;
  min-height:0;overflow:hidden;background:#000;
}
.film-stage{
  position:absolute;inset:0;perspective:1000px;
  perspective-origin:50% 50%;overflow:hidden;
  isolation:isolate;opacity:0;
  transition:opacity 1100ms ease-in-out;
}
.film-stage.revealed{opacity:1}
.film-item{
  position:absolute;top:22dvh;left:50%;
  width:max-content;height:300px;
  transform-origin:center center;backface-visibility:hidden;
  will-change:transform,opacity,filter;pointer-events:none;
}
.film-item img{
  display:block;width:auto;height:100%;max-width:none;
  object-fit:contain;backface-visibility:hidden;
}

/* SCROLL LOCK */
html.film-locked{
  scroll-behavior:auto!important;
  overflow:hidden!important;overscroll-behavior:none;
}
body.film-locked{
  overflow:hidden!important;overscroll-behavior:none;
}

/* COLLAGE RETURN */
.return-scene{
  position:fixed;inset:0;z-index:5000;overflow:hidden;
  background:transparent;opacity:0;visibility:hidden;
  pointer-events:none;
}
.return-scene.active{opacity:1;visibility:visible}
.return-catalogue{
  position:absolute;inset:0;opacity:0;will-change:opacity;
}
.return-tile{
  position:absolute;overflow:hidden;background:#000;
}
.return-tile img{
  display:block;width:100%;height:100%;object-fit:cover;
}
.return-flight{
  position:fixed;left:0;top:0;z-index:5100;
  overflow:hidden;pointer-events:none;transform-origin:top left;
  will-change:transform,width,height;
}
.return-flight img{
  display:block;width:100%;height:100%;object-fit:cover;
}

/* MOBILE */
@media(max-width:700px){
  .site-logo{top:26px;right:20px;width:170px}
  .opening{height:115vh;min-height:700px}
  .korean-group{
    left:9%;top:calc(100vh - 135px);width:min(315px,82vw);
  }
  .english-group{
    left:9%;top:calc(100vh + 12px);width:min(350px,82vw);
  }
  .film-section{height:75vh;height:75dvh}
  .film-item{top:25dvh;height:200px}
}
@media(prefers-reduced-motion:reduce){
  .text-echo{animation:none}
}
</style>
</head>
<body>

<a href="index.html" class="site-logo" id="site-logo">
  <img src="integuments-red-logo.png" alt="INTEGUMENTS">
</a>

<section class="opening" id="opening">
  <div class="korean-group" id="korean-text">
    <div class="text-motion">
      <img class="text-echo" id="korean-echo" alt="" aria-hidden="true">
      <img class="text-original" id="korean-original" alt="남들처럼">
    </div>
  </div>

  <div class="english-group" id="english-text">
    <div class="text-motion">
      <img class="text-echo" id="english-echo" alt="" aria-hidden="true">
      <img class="text-original" id="english-original" alt="a borrowed life">
    </div>
  </div>
</section>

<section class="film-section" id="film-section">
  <div class="film-stage" id="film-stage"></div>
</section>

<div class="return-scene" id="return-scene">
  <div class="return-catalogue" id="return-catalogue"></div>
</div>

<script>
function clamp(value,min=0,max=1){
  return Math.max(min,Math.min(max,value));
}
function smoothstep(value){
  const t=clamp(value);
  return t*t*(3-2*t);
}
function easeInOutCubic(t){
  t=clamp(t);
  return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}
function lerp(a,b,t){
  return a+(b-a)*t;
}

/* TEXT IMAGE */
const TEXT_SOURCE="2-10 text.png";
const koreanOriginal=document.getElementById("korean-original");
const englishOriginal=document.getElementById("english-original");
const koreanEcho=document.getElementById("korean-echo");
const englishEcho=document.getElementById("english-echo");

function cropText(source,top,bottom){
  const W=source.naturalWidth;
  const H=source.naturalHeight;
  const y0=Math.max(0,Math.floor(top));
  const y1=Math.min(H,Math.ceil(bottom));
  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=Math.max(1,y1-y0);
  canvas.getContext("2d").drawImage(
    source,0,y0,W,y1-y0,0,0,W,y1-y0
  );
  return canvas.toDataURL("image/png");
}

function detectTextBands(source){
  const W=source.naturalWidth;
  const H=source.naturalHeight;
  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(source,0,0);
  const data=ctx.getImageData(0,0,W,H).data;
  const active=[];

  for(let y=0;y<H;y++){
    let count=0;
    for(let x=0;x<W;x+=2){
      const i=(y*W+x)*4;
      if(
        data[i+3]>30 &&
        data[i]>data[i+1]*1.35 &&
        data[i]>data[i+2]*1.2 &&
        data[i]>25
      )count++;
    }
    active[y]=count>=2;
  }

  const bands=[];
  let start=-1,last=-1;
  for(let y=0;y<H;y++){
    if(active[y]){
      if(start<0)start=y;
      last=y;
    }else if(start>=0&&y-last>Math.max(4,H*.018)){
      bands.push({top:start,bottom:last+1});
      start=-1;
      last=-1;
    }
  }
  if(start>=0)bands.push({top:start,bottom:last+1});

  if(bands.length<2){
    return [
      {top:0,bottom:H*.30},
      {top:H*.65,bottom:H}
    ];
  }

  let largestGap=-1,splitIndex=1;
  for(let i=1;i<bands.length;i++){
    const gap=bands[i].top-bands[i-1].bottom;
    if(gap>largestGap){
      largestGap=gap;
      splitIndex=i;
    }
  }

  const first=bands.slice(0,splitIndex);
  const second=bands.slice(splitIndex);
  return [
    {
      top:Math.max(0,first[0].top-4),
      bottom:Math.min(H,first[first.length-1].bottom+4)
    },
    {
      top:Math.max(0,second[0].top-4),
      bottom:Math.min(H,second[second.length-1].bottom+4)
    }
  ];
}

function prepareText(){
  const source=new Image();
  source.onload=()=>{
    const bands=detectTextBands(source);
    const koreanSrc=cropText(
      source,bands[0].top,bands[0].bottom
    );
    const englishSrc=cropText(
      source,bands[1].top,bands[1].bottom
    );
    koreanOriginal.src=koreanSrc;
    koreanEcho.src=koreanSrc;
    englishOriginal.src=englishSrc;
    englishEcho.src=englishSrc;
  };
  source.onerror=()=>console.error("Cannot load "+TEXT_SOURCE);
  source.src=TEXT_SOURCE;
}
prepareText();

/* SCROLL TEXT FADE */
const koreanText=document.getElementById("korean-text");
const englishText=document.getElementById("english-text");
const opening=document.getElementById("opening");
const section=document.getElementById("film-section");
const stage=document.getElementById("film-stage");
const returnScene=document.getElementById("return-scene");
const returnCatalogue=document.getElementById("return-catalogue");
const siteLogo=document.getElementById("site-logo");

function updateTextScroll(){
  const scrollY=window.scrollY;
  const viewport=window.innerHeight;
  const openingBottom=opening.offsetTop+opening.offsetHeight;
  const fadeStart=openingBottom-viewport*.75;
  const fadeEnd=openingBottom-viewport*.30;
  const fadeProgress=smoothstep(
    (scrollY-fadeStart)/(fadeEnd-fadeStart)
  );
  koreanText.style.opacity=1-fadeProgress;
  englishText.style.opacity=1-fadeProgress;
  return fadeProgress;
}

/* FILM IMAGES */
const images=[
  "guillem.jpg","body.jpg","jamie.jpg","abreale1.jpg",
  "light1.jpg","annecy.jpg","paris.jpg","spiral.jpg",
  "abreale2.jpg","soho.jpg","abreale3.jpg","abreale4.jpg",
  "poles.jpg","light2.jpg","abreale5.jpg","amsterdam.jpg",
  "morris.jpg","abreale6.jpg","ice.jpg","abreale7.jpg","nyc.jpg"
];

const cards=images.map(filename=>{
  const card=document.createElement("div");
  card.className="film-item";
  const img=document.createElement("img");
  img.src=filename;
  img.alt=filename;
  img.draggable=false;
  card.appendChild(img);
  stage.appendChild(card);
  return card;
});

const total=cards.length;
const FOCUS_INDEX=9;
const RUN_DURATION=3200;
const EXPAND_DURATION=1800;
const HOLD_DURATION=300;
const RETURN_DURATION=2000;

let animationStarted=false;
let animationStart=null;
let currentPosition=FOCUS_INDEX;
let finished=false;
let expanding=false;
let expansionProgress=0;
let scrollLocked=false;
let lockedScrollY=0;
let returning=false;

function getDistance(index,position){
  let distance=index-position;
  while(distance<-total/2)distance+=total;
  while(distance>total/2)distance-=total;
  return distance;
}

function updateRevealMask(img,distance){
  const reveal=smoothstep((distance+.35)/1.65);
  const width=45*reveal;
  if(width<.1){
    img.style.webkitMaskImage="none";
    img.style.maskImage="none";
    return;
  }
  const gradient=`linear-gradient(
    to right,
    transparent 0%,
    rgba(0,0,0,.12) ${width*.18}%,
    rgba(0,0,0,.32) ${width*.40}%,
    rgba(0,0,0,.62) ${width*.68}%,
    rgba(0,0,0,.85) ${width*.88}%,
    black ${width}%,
    black 100%
  )`;
  img.style.webkitMaskImage=gradient;
  img.style.maskImage=gradient;
}

function render(position,finalMode=false,expansion=0){
  currentPosition=position;
  const mobile=window.innerWidth<=700;
  const spacing=mobile?112:175;
  const baseHeight=mobile?200:300;

  cards.forEach((card,index)=>{
    const distance=getDistance(
      index,finalMode?FOCUS_INDEX:position
    );
    const abs=Math.abs(distance);
    const x=distance*spacing;
    const y=Math.min(abs*abs*3.5,65);
    const z=-abs*125;
    const rotateY=clamp(-distance*15,-65,65);
    const scale=Math.max(.55,1-abs*.055);
    const opacity=clamp(1-abs*.095);
    const brightness=clamp(1-abs*.085,.22,1);
    const img=card.querySelector("img");

    card.style.height=baseHeight+"px";
    updateRevealMask(img,distance);
    card.style.opacity=opacity;
    card.style.filter=`brightness(${brightness})`;
    card.style.transform=`
      translate(-50%,-50%)
      translate3d(${x}px,${y}px,${z}px)
      rotateY(${rotateY}deg)
      scale(${scale})
    `;
    card.style.zIndex=String(1000-Math.round(abs*10));
    card.style.visibility=opacity<=0?"hidden":"visible";
  });

  if(finalMode){
    const focus=cards[FOCUS_INDEX];
    const img=focus.querySelector("img");
    const eased=easeInOutCubic(expansion);
    const sectionHeight=section.clientHeight;
    const centerY=mobile
      ?window.innerHeight*.25
      :window.innerHeight*.22;
    const safeHeight=Math.max(
      100,
      Math.min(
        sectionHeight*.70,
        centerY*2-24,
        (sectionHeight-centerY)*2-24
      )
    );
    const finalHeight=mobile
      ?Math.min(safeHeight,380)
      :Math.min(safeHeight,476);

    focus.style.height=(
      baseHeight+(finalHeight-baseHeight)*eased
    )+"px";
    img.style.webkitMaskImage="none";
    img.style.maskImage="none";
    focus.style.transform=`
      translate(-50%,-50%)
      translate3d(0px,0px,0px)
      rotateY(0deg)
      scale(1)
    `;
    focus.style.opacity="1";
    focus.style.filter="brightness(1)";
    focus.style.zIndex="1100";
    focus.style.visibility="visible";
  }
}
render(FOCUS_INDEX);

/* SCROLL PROTECTION */
function preventFilmWheel(event){
  if(!scrollLocked)return;
  if(event.cancelable)event.preventDefault();
}

function preventFilmKeys(event){
  if(!scrollLocked)return;
  const blockedKeys=[
    "ArrowUp","ArrowDown","ArrowLeft","ArrowRight",
    "PageUp","PageDown","Home","End"," ","Spacebar"
  ];
  if(blockedKeys.includes(event.key))event.preventDefault();
}

window.addEventListener(
  "wheel",preventFilmWheel,{passive:false,capture:true}
);
window.addEventListener(
  "touchmove",preventFilmWheel,{passive:false,capture:true}
);
window.addEventListener(
  "keydown",preventFilmKeys,{capture:true}
);

function enforceFilmPosition(){
  if(!scrollLocked)return;
  if(Math.abs(window.scrollY-lockedScrollY)>1){
    window.scrollTo(0,lockedScrollY);
  }
}

function lockFilmScroll(){
  if(scrollLocked)return;
  const finalScroll=Math.max(
    0,
    document.documentElement.scrollHeight-window.innerHeight
  );
  document.documentElement.style.scrollBehavior="auto";
  document.body.style.scrollBehavior="auto";
  window.scrollTo(0,finalScroll);
  lockedScrollY=window.scrollY;
  scrollLocked=true;
  document.documentElement.classList.add("film-locked");
  document.body.classList.add("film-locked");
}

function startFilmAnimation(){
  if(animationStarted)return;
  animationStarted=true;
  lockFilmScroll();
  stage.classList.add("revealed");
  animationStart=performance.now();
  requestAnimationFrame(animateFilm);
}

function animateFilm(now){
  enforceFilmPosition();
  const elapsed=now-animationStart;

  if(elapsed<RUN_DURATION){
    render(FOCUS_INDEX+(elapsed/RUN_DURATION)*total);
    requestAnimationFrame(animateFilm);
    return;
  }

  expanding=true;
  expansionProgress=clamp(
    (elapsed-RUN_DURATION)/EXPAND_DURATION
  );
  render(FOCUS_INDEX+total,true,expansionProgress);

  if(expansionProgress<1){
    requestAnimationFrame(animateFilm);
  }else{
    finished=true;
    render(FOCUS_INDEX+total,true,1);
    setTimeout(startSeamlessReturn,HOLD_DURATION);
  }
}

/* COLLAGE */
const catalogueTiles=[
  ["guillem.jpg",0,0,12.2,27.5],
  ["body.jpg",12.2,0,23.4,27.5],
  ["jamie.jpg",35.6,0,12.2,27.5],
  ["abreale1.jpg",47.8,0,27.8,27.5],
  ["light1.jpg",75.6,0,24.4,27.5],
  ["annecy.jpg",0,27.5,14.2,33],
  ["paris.jpg",14.2,27.5,14.2,33],
  ["spiral.jpg",28.4,27.5,12.6,33],
  ["abreale2.jpg",41,27.5,12.8,33],
  ["soho.jpg",53.8,27.5,29.2,33],
  ["abreale3.jpg",83,27.5,17,33],
  ["abreale4.jpg",0,60.5,32.6,39.5],
  ["poles.jpg",32.6,60.5,14.6,17],
  ["light2.jpg",47.2,60.5,14.4,17],
  ["abreale6.jpg",61.6,60.5,15.6,17],
  ["amsterdam.jpg",77.2,60.5,10.2,17],
  ["nyc.jpg",87.4,60.5,12.6,39.5],
  ["morris.jpg",32.6,77.5,16,22.5],
  ["abreale5.jpg",48.6,77.5,10.5,22.5],
  ["ice.jpg",59.1,77.5,18.1,22.5],
  ["abreale7.jpg",77.2,77.5,10.2,22.5]
];

catalogueTiles.forEach(([src,x,y,w,h])=>{
  const tile=document.createElement("div");
  tile.className="return-tile";
  tile.style.left=x+"%";
  tile.style.top=y+"%";
  tile.style.width=w+"%";
  tile.style.height=h+"%";

  if(src!=="soho.jpg"){
    const img=document.createElement("img");
    img.src=src;
    img.alt="";
    if(
      src==="body.jpg"||
      src==="abreale1.jpg"||
      src==="abreale3.jpg"
    ){
      img.style.objectPosition="50% 45%";
    }
    tile.appendChild(img);
  }
  returnCatalogue.appendChild(tile);
});

/* RETURN TO SOHO */
function startSeamlessReturn(){
  if(returning)return;
  returning=true;
  siteLogo.classList.add("return-hidden");

  const focus=cards[FOCUS_INDEX];
  const origin=focus.querySelector("img").getBoundingClientRect();
  const destination={
    left:window.innerWidth*.538,
    top:window.innerHeight*.275,
    width:window.innerWidth*.292,
    height:window.innerHeight*.33
  };

  const flight=document.createElement("div");
  flight.className="return-flight";
  const img=document.createElement("img");
  img.src="soho.jpg";
  img.alt="";
  flight.appendChild(img);
  returnScene.appendChild(flight);

  flight.style.width=origin.width+"px";
  flight.style.height=origin.height+"px";
  flight.style.transform=
    `translate3d(${origin.left}px,${origin.top}px,0)`;

  returnScene.classList.add("active");
  focus.style.visibility="hidden";

  const start=performance.now();

  function tick(now){
    enforceFilmPosition();
    const t=clamp((now-start)/RETURN_DURATION);
    const e=easeInOutCubic(t);

    stage.style.opacity=String(1-smoothstep(t/.65));
    returnCatalogue.style.opacity=String(
      smoothstep((t-.10)/.70)
    );

    const x=lerp(origin.left,destination.left,e);
    const y=lerp(origin.top,destination.top,e)
      -Math.sin(Math.PI*t)*38;
    const w=lerp(origin.width,destination.width,e);
    const h=lerp(origin.height,destination.height,e);

    flight.style.width=w+"px";
    flight.style.height=h+"px";
    flight.style.transform=`translate3d(${x}px,${y}px,0)`;

    if(t<1){
      requestAnimationFrame(tick);
    }else{
      flight.style.width=destination.width+"px";
      flight.style.height=destination.height+"px";
      flight.style.transform=`translate3d(
        ${destination.left}px,
        ${destination.top}px,
        0
      )`;
      returnCatalogue.style.opacity="1";

      try{
        sessionStorage.setItem(
          "integuments-seamless-arrival",
          JSON.stringify({
            image:"soho.jpg",
            time:Date.now()
          })
        );
      }catch(error){}

      window.location.replace("page2.html");
    }
  }
  requestAnimationFrame(tick);
}

/* SCROLL TRANSITION */
function updateScrollEffects(){
  if(scrollLocked)return;
  const fadeProgress=updateTextScroll();
  const filmRect=section.getBoundingClientRect();

  if(
    fadeProgress>=1 &&
    filmRect.top<=window.innerHeight
  ){
    startFilmAnimation();
  }else{
    stage.classList.remove("revealed");
  }
}

window.addEventListener(
  "scroll",updateScrollEffects,{passive:true}
);
window.addEventListener("load",updateScrollEffects);

window.addEventListener("resize",()=>{
  if(scrollLocked){
    const finalScroll=Math.max(
      0,
      document.documentElement.scrollHeight-window.innerHeight
    );
    window.scrollTo(0,finalScroll);
    lockedScrollY=window.scrollY;
  }else{
    updateScrollEffects();
  }

  if(finished){
    render(FOCUS_INDEX+total,true,1);
  }else if(expanding){
    render(FOCUS_INDEX+total,true,expansionProgress);
  }else{
    render(currentPosition);
  }
});

updateScrollEffects();
</script>
</body>
</html>
