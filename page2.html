/* FULL SCREEN PHOTOGRAPHY PAGE */

  height:100vh;
  height:100dvh;
  overflow:hidden;

/* ORIGINAL COLLAGE */

.collage{

  inset:0;
  z-index:10;
  width:100%;
  height:100%;
  overflow:hidden;
  opacity:1;
  visibility:visible;
  transform:none;
  transform-origin:center;
  pointer-events:auto;

}

  -webkit-user-drag:none;
}

  z-index:20;

<script>
"use strict";

const collage=document.getElementById("collage");
const images=[...collage.querySelectorAll("img")];

/*
  ORIGINAL COLOR PALETTES

  These preserve the same color sequence.
  Only the animation method is optimized.
*/

const originalRed=
  "grayscale(0) sepia(0) hue-rotate(0deg) saturate(1) brightness(1)";

const blackWhite=
  "grayscale(1) sepia(0) hue-rotate(0deg) saturate(1) brightness(1.04)";

const icyBlue=
  "grayscale(1) sepia(.30) hue-rotate(165deg) saturate(.85) brightness(1.02)";

const emerald=
  "grayscale(1) sepia(.38) hue-rotate(95deg) saturate(.9) brightness(.99)";

const mutedPurple=
  "grayscale(1) sepia(.30) hue-rotate(235deg) saturate(.75) brightness(1)";

const warmMonochrome=
  "grayscale(1) sepia(.25) hue-rotate(0deg) saturate(.75) brightness(.98)";

/* ORIGINAL COLOR ORDER */

const colorStages=[
  originalRed,
  blackWhite,
  originalRed,
  icyBlue,
  originalRed,
  emerald,
  originalRed,
  mutedPurple,
  originalRed,
  warmMonochrome,
  originalRed
];

const transitionDuration=2000;

let currentStage=0;
let colorTimer=null;
let colorCycleStarted=false;

/*
  PERFORMANCE OPTIMIZATION

  The previous code recalculated the filter
  continuously with requestAnimationFrame.

  This version changes the filter target
  once every two seconds.

  CSS handles the transition in between.
*/

function advanceColor(){
  currentStage=
    (currentStage+1)%colorStages.length;

  collage.style.filter=
    colorStages[currentStage];
}

function startColorCycle(){
  if(colorCycleStarted)return;

  colorCycleStarted=true;
  currentStage=0;

  collage.style.transition="none";
  collage.style.filter=originalRed;

  /* Allow the original collage to paint first. */

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      collage.style.transition=
        "filter 2000ms cubic-bezier(.45,0,.55,1)";

      colorTimer=setInterval(
        advanceColor,
        transitionDuration
      );
    });
  });
}

/* KEEP ORIGINAL ARRIVAL HANDLING */

function checkArrival(){
  try{
    const filmArrival=sessionStorage.getItem(
      "integuments-seamless-arrival"
    );

    const openingArrival=sessionStorage.getItem(
      "integuments-from-page1"
    );

    sessionStorage.removeItem(
      "integuments-seamless-arrival"
    );

    sessionStorage.removeItem(
      "integuments-return-flight"
    );

    sessionStorage.removeItem(
      "integuments-from-page1"
    );

    if(filmArrival){
      const arrival=JSON.parse(filmArrival);

      if(
        arrival.image &&
        Date.now()-arrival.time<15000
      ){
        return true;
      }
    }

    if(openingArrival){
      const arrival=JSON.parse(openingArrival);

      if(Date.now()-arrival.time<15000){
        return true;
      }
    }

    return false;

  }catch(error){
    return false;
  }
}

const arrivingFromAnotherPage=checkArrival();

/* INITIAL COLLAGE STATE */

collage.style.opacity="1";
collage.style.visibility="visible";
collage.style.transform="none";
collage.style.filter=originalRed;

/*
  Load images asynchronously.

  Do not block the collage on Promise.all.
  Begin the color cycle after initial paint.
*/

images.forEach(img=>{
  img.loading="eager";
  img.decoding="async";
});

/* START COLOR TRANSITIONS */

if(document.readyState==="complete"){
  startColorCycle();
}else{
  window.addEventListener(
    "load",
    startColorCycle,
    {once:true}
  );
}

/* PAUSE COLOR WORK WHEN TAB IS HIDDEN */

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden){
      if(colorTimer!==null){
        clearInterval(colorTimer);
        colorTimer=null;
      }
    }else if(colorCycleStarted && colorTimer===null){
      colorTimer=setInterval(
        advanceColor,
        transitionDuration
      );
    }
  }
);

/* NO RED OPENING ON PAGE 2 */

if("scrollRestoration" in history){
  history.scrollRestoration="manual";
}

window.scrollTo(0,0);

</script>
