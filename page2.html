<script>
const collage=document.getElementById("collage");
const images=[...collage.querySelectorAll("img")];

function waitForImage(img){
  return new Promise(resolve=>{
    if(img.complete){
      resolve();
      return;
    }
    img.addEventListener("load",resolve,{once:true});
    img.addEventListener("error",resolve,{once:true});
  });
}

/* AUTOMATIC COLOR PALETTE */
const originalRed={
  grayscale:0,sepia:0,hue:0,
  saturation:1,brightness:1
};
const blackWhite={
  grayscale:1,sepia:0,hue:0,
  saturation:1,brightness:1.04
};
const icyBlue={
  grayscale:1,sepia:.30,hue:165,
  saturation:.85,brightness:1.02
};
const emerald={
  grayscale:1,sepia:.38,hue:95,
  saturation:.9,brightness:.99
};
const mutedPurple={
  grayscale:1,sepia:.30,hue:235,
  saturation:.75,brightness:1
};
const warmMonochrome={
  grayscale:1,sepia:.25,hue:0,
  saturation:.75,brightness:.98
};

const colorStages=[
  originalRed,
  blackWhite,
  originalRed,
  icyBlue,
  originalRed,
  emerald,
  originalRed,
  mutedPurple,
  originalRed,
  warmMonochrome,
  originalRed
];

const transitionDuration=2000;
let transitionStart=null;
let currentStage=0;

function lerp(a,b,t){
  return a+(b-a)*t;
}
function smoothstep(t){
  t=Math.max(0,Math.min(1,t));
  return t*t*(3-2*t);
}
function interpolateFilter(a,b,t){
  return {
    grayscale:lerp(a.grayscale,b.grayscale,t),
    sepia:lerp(a.sepia,b.sepia,t),
    hue:lerp(a.hue,b.hue,t),
    saturation:lerp(a.saturation,b.saturation,t),
    brightness:lerp(a.brightness,b.brightness,t)
  };
}
function filterToCSS(f){
  return `
    grayscale(${f.grayscale})
    sepia(${f.sepia})
    hue-rotate(${f.hue}deg)
    saturate(${f.saturation})
    brightness(${f.brightness})
  `;
}

function animate(now){
  if(transitionStart===null){
    transitionStart=now;
  }

  const elapsed=now-transitionStart;

  if(elapsed>=transitionDuration){
    const completed=Math.floor(
      elapsed/transitionDuration
    );
    currentStage=(
      currentStage+completed
    )%colorStages.length;
    transitionStart+=completed*transitionDuration;
  }

  const progress=smoothstep(
    (now-transitionStart)/transitionDuration
  );
  const nextStage=(
    currentStage+1
  )%colorStages.length;

  collage.style.filter=filterToCSS(
    interpolateFilter(
      colorStages[currentStage],
      colorStages[nextStage],
      progress
    )
  );

  requestAnimationFrame(animate);
}

/* SEAMLESS ARRIVAL */
function checkArrival(){
  try{
    const raw=sessionStorage.getItem(
      "integuments-seamless-arrival"
    );

    sessionStorage.removeItem(
      "integuments-seamless-arrival"
    );

    /* REMOVE OLD RETURN DATA */
    sessionStorage.removeItem(
      "integuments-return-flight"
    );

    if(!raw)return false;

    const arrival=JSON.parse(raw);

    return (
      arrival.image==="guillem.jpg" &&
      Date.now()-arrival.time<15000
    );
  }catch(error){
    return false;
  }
}

const arrivingFromFilm=checkArrival();

/* DISPLAY COLLAGE AND RESUME COLOR CYCLE */
Promise.all(images.map(waitForImage)).then(()=>{
  collage.style.filter=filterToCSS(originalRed);
  collage.classList.add("is-ready");

  /* START AUTOMATIC 2-SECOND COLOR TRANSITIONS */
  requestAnimationFrame(animate);
});
</script>
