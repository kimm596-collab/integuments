<style>

html,body{

  left:0;

  overflow:visible;

/* LARGE MATTE EMBOSSED TITLE */

  width:max-content;
  max-width:none;
  margin:0;
  padding:0;

  font-family:

    sans-serif;

  font-weight:900;
  font-stretch:condensed;
  font-size:clamp(100px,18vw,400px);
  line-height:.82;
  letter-spacing:-.065em;
  white-space:nowrap;

  /* MATTE RED-ON-RED EMBOSS */
  color:#a50000;

  text-shadow:
    0 -1px 0 rgba(75,0,0,.65),
    0 -2px 1px rgba(90,0,0,.32),
    -1px 0 0 rgba(100,0,0,.45),
    1px 0 0 rgba(255,35,35,.25),
    0 1px 0 rgba(255,48,48,.7),
    0 2px 1px rgba(255,45,45,.38),
    0 3px 3px rgba(90,0,0,.12);

  transform-origin:top left;
  user-select:none;
  will-change:transform,opacity;
}

/* COLLAGE */
.collage{
  position:absolute;
  inset:0;
  z-index:10;
  width:100%;
  height:100%;
  overflow:hidden;
  visibility:hidden;
  opacity:0;
  filter:none;
  transform:scale(1.035);
  transform-origin:center center;
  will-change:filter,opacity,transform;
  pointer-events:none;
}

.collage.is-ready{
  visibility:visible;
}

.collage.is-interactive{
  pointer-events:auto;
}

.tile{
  position:absolute;
  display:block;
  overflow:hidden;
  text-decoration:none;
  cursor:pointer;
}

.tile img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  transform:none;
  border:0;
  user-select:none;
  -webkit-user-drag:none;
}

.tile:focus-visible{
  outline:2px solid #E60000;
  outline-offset:-2px;
  z-index:10;
}

/* TOP ROW */
.p01{left:0%;top:0%;width:12.2%;height:27.5%}

/* BOTTOM SECTION */

.p13{left:32.6%;top:60.5%;width:14.6%;height:17%}

/* ORIGINAL CROPPING */
.p01 img{object-position:50% 50%}
.p02 img{object-position:50% 45%}

.p09 img{object-position:50% 50%}

.p13 img{object-position:50% 50%}

<body>

<main class="page2">

<script>
const collage=document.getElementById("collage");
const images=[...collage.querySelectorAll("img")];
const intro=document.getElementById("intro");
const introTitle=document.getElementById("introTitle");

/* PRECISE LETTER CENTERING */
let titleScale=1;
let titleLeft=0;

function fitIntroTitle(){
  const style=getComputedStyle(introTitle);

  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");

  ctx.font=`
    ${style.fontWeight}
    ${style.fontSize}
    ${style.fontFamily}
  `;

  const metrics=ctx.measureText("INTEGUMENTS");

  const letterSpacing=parseFloat(style.letterSpacing)||0;
  const spacingWidth=letterSpacing*("INTEGUMENTS".length-1);

  const actualLeft=metrics.actualBoundingBoxLeft;
  const actualRight=metrics.actualBoundingBoxRight;

  const visibleWidth=
    actualLeft+actualRight+spacingWidth;

  const desiredWidth=window.innerWidth*.98;

  titleScale=desiredWidth/visibleWidth;

  const leftInkOffset=actualLeft*titleScale;

  titleLeft=
    (window.innerWidth-desiredWidth)/2+leftInkOffset;

  introTitle.style.left=titleLeft+"px";

  updateVisuals();
}

/* IMAGE LOADING */
function waitForImage(img){
  return new Promise(resolve=>{
    if(img.complete){
      resolve();
      return;
    }
    img.addEventListener("load",resolve,{once:true});
    img.addEventListener("error",resolve,{once:true});
  });
}

/* ORIGINAL COLOR PALETTES */
const originalRed={
  grayscale:0,sepia:0,hue:0,
  saturation:1,brightness:1
};

const blackWhite={
  grayscale:1,sepia:0,hue:0,
  saturation:1,brightness:1.04
};

const icyBlue={
  grayscale:1,sepia:.30,hue:165,
  saturation:.85,brightness:1.02
};

const emerald={
  grayscale:1,sepia:.38,hue:95,
  saturation:.9,brightness:.99
};

const mutedPurple={
  grayscale:1,sepia:.30,hue:235,
  saturation:.75,brightness:1
};

const warmMonochrome={
  grayscale:1,sepia:.25,hue:0,
  saturation:.75,brightness:.98
};

const colorStages=[
  originalRed,
  blackWhite,
  originalRed,
  icyBlue,
  originalRed,
  emerald,
  originalRed,
  mutedPurple,
  originalRed,
  warmMonochrome,
  originalRed
];

const transitionDuration=2000;
let transitionStart=null;
let currentStage=0;
let colorCycleStarted=false;

function lerp(a,b,t){
  return a+(b-a)*t;
}

function smoothstep(t){
  t=Math.max(0,Math.min(1,t));
  return t*t*(3-2*t);
}

function interpolateFilter(a,b,t){
  return {
    grayscale:lerp(a.grayscale,b.grayscale,t),
    sepia:lerp(a.sepia,b.sepia,t),
    hue:lerp(a.hue,b.hue,t),
    saturation:lerp(a.saturation,b.saturation,t),
    brightness:lerp(a.brightness,b.brightness,t)
  };
}

function filterToCSS(f){
  return `
    grayscale(${f.grayscale})
    sepia(${f.sepia})
    hue-rotate(${f.hue}deg)
    saturate(${f.saturation})
    brightness(${f.brightness})
  `;
}

function animateColors(now){
  if(transitionStart===null){
    transitionStart=now;
  }

  const elapsed=now-transitionStart;

  if(elapsed>=transitionDuration){
    const completed=Math.floor(
      elapsed/transitionDuration
    );

    currentStage=(
      currentStage+completed
    )%colorStages.length;

    transitionStart+=completed*transitionDuration;
  }

  const progress=smoothstep(
    (now-transitionStart)/transitionDuration
  );

  const nextStage=(
    currentStage+1
  )%colorStages.length;

  collage.style.filter=filterToCSS(
    interpolateFilter(
      colorStages[currentStage],
      colorStages[nextStage],
      progress
    )
  );

  requestAnimationFrame(animateColors);
}

function startColorCycle(){
  if(colorCycleStarted)return;

  colorCycleStarted=true;
  transitionStart=null;
  currentStage=0;

  collage.style.filter=filterToCSS(originalRed);
  requestAnimationFrame(animateColors);
}

/* SEAMLESS ARRIVAL */
function checkArrival(){
  try{
    const raw=sessionStorage.getItem(
      "integuments-seamless-arrival"
    );

    sessionStorage.removeItem(
      "integuments-seamless-arrival"
    );

    sessionStorage.removeItem(
      "integuments-return-flight"
    );

    if(!raw)return false;

    const arrival=JSON.parse(raw);

    return (
      arrival.image==="guillem.jpg" &&
      Date.now()-arrival.time<15000
    );
  }catch(error){
    return false;
  }
}

const arrivingFromFilm=checkArrival();

/* SMOOTH SCROLL REVEAL */
let targetProgress=0;
let currentProgress=0;
let lastFrameTime=0;
let imagesReady=false;

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function getScrollProgress(){
  const maxScroll=Math.max(
    1,
    document.documentElement.scrollHeight-window.innerHeight
  );

  return clamp(window.scrollY/maxScroll,0,1);
}

function updateVisuals(){
  const p=smoothstep(currentProgress);

  const reveal=smoothstep(
    clamp((p-.04)/.94,0,1)
  );

  collage.style.opacity=reveal;

  const collageScale=1.035-(reveal*.035);
  collage.style.transform=`scale(${collageScale})`;

  intro.style.opacity=1-reveal;

  const titleMove=-currentProgress*35;

  introTitle.style.transform=
    `translateY(${titleMove}px) scaleX(${titleScale})`;

  introTitle.style.opacity=
    1-smoothstep(
      clamp(currentProgress/.75,0,1)
    );

  const fullyRevealed=reveal>.995;

  collage.classList.toggle(
    "is-interactive",
    fullyRevealed
  );

  intro.style.pointerEvents=
    fullyRevealed?"none":"auto";

  if(
    fullyRevealed &&
    imagesReady &&
    !colorCycleStarted
  ){
    startColorCycle();
  }
}

function render(now){
  if(!lastFrameTime){
    lastFrameTime=now;
  }

  const dt=Math.min(
    (now-lastFrameTime)/1000,
    .05
  );

  lastFrameTime=now;

  targetProgress=getScrollProgress();

  const smoothing=1-Math.exp(-dt*5.5);

  currentProgress+=
    (targetProgress-currentProgress)*smoothing;

  if(Math.abs(targetProgress-currentProgress)<.0001){
    currentProgress=targetProgress;
  }

  updateVisuals();

  requestAnimationFrame(render);
}

/* INITIAL POSITION */
if("scrollRestoration" in history){
  history.scrollRestoration="manual";
}

if(arrivingFromFilm){
  window.scrollTo(0,document.body.scrollHeight);
  targetProgress=1;
  currentProgress=1;
}else{
  window.scrollTo(0,0);
  targetProgress=0;
  currentProgress=0;
}

/* INITIAL RENDER */
fitIntroTitle();
updateVisuals();

document.fonts.ready.then(fitIntroTitle);
window.addEventListener("resize",fitIntroTitle);

/* LOAD COLLAGE IN ORIGINAL RED */
Promise.all(images.map(waitForImage)).then(()=>{
  imagesReady=true;

  collage.style.filter=filterToCSS(originalRed);
  collage.classList.add("is-ready");

  if(currentProgress>=.995){
    startColorCycle();
  }
});

requestAnimationFrame(render);
</script>

</body>
