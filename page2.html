<style>
:root{
  --red:#E60000;
  --red-filter:grayscale(1) sepia(1) saturate(9)
    hue-rotate(320deg) brightness(.93) contrast(1.1);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--red);
}

.page2{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  isolation:isolate;
  background:var(--red);
}

.collage{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--red);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  filter:var(--red-filter);
  transition:none;
}

.collage.ready{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.tile{
  position:absolute;
  display:block;
  overflow:hidden;
  background:var(--red);
  text-decoration:none;
  cursor:pointer;
}

.tile img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  border:0;
  user-select:none;
  -webkit-user-drag:none;
}

.tile:focus-visible{
  outline:2px solid white;
  outline-offset:-2px;
  z-index:30;
}

<script>
"use strict";

const collage=document.getElementById("collage");
const images=[...collage.querySelectorAll("img")];

const RED="grayscale(1) sepia(1) saturate(9) hue-rotate(320deg) brightness(.93) contrast(1.1)";
const BW="grayscale(1) sepia(0) saturate(1) brightness(1.04)";
const BLUE="grayscale(1) sepia(.30) hue-rotate(165deg) saturate(.85) brightness(1.02)";
const GREEN="grayscale(1) sepia(.38) hue-rotate(95deg) saturate(.9) brightness(.99)";
const PURPLE="grayscale(1) sepia(.30) hue-rotate(235deg) saturate(.75) brightness(1)";
const WARM="grayscale(1) sepia(.25) hue-rotate(0deg) saturate(.75) brightness(.98)";

const colors=[
  RED,BW,RED,BLUE,RED,GREEN,
  RED,PURPLE,RED,WARM,RED
];

let colorIndex=0;
let colorTimer=null;
let startTimer=null;
let started=false;

function prepareImage(img){
  img.loading="eager";
  img.decoding="async";
  img.fetchPriority="high";

  return new Promise(resolve=>{
    function finish(){
      if(!img.naturalWidth){
        resolve(false);
        return;
      }

      if(typeof img.decode==="function"){
        img.decode()
          .then(()=>resolve(true))
          .catch(()=>resolve(true));
      }else{
        resolve(true);
      }
    }

    if(img.complete){
      finish();
    }else{
      img.addEventListener("load",finish,{once:true});
      img.addEventListener(
        "error",
        ()=>resolve(false),
        {once:true}
      );
    }
  });
}

function nextColor(){
  colorIndex=(colorIndex+1)%colors.length;
  collage.style.filter=colors[colorIndex];
}

function startColors(){
  if(started)return;

  started=true;
  colorIndex=0;

  collage.style.transition="none";
  collage.style.filter=RED;

  startTimer=setTimeout(()=>{
    collage.style.transition=
      "filter 2000ms cubic-bezier(.45,0,.55,1)";

    nextColor();

    colorTimer=setInterval(
      nextColor,
      2300
    );
  },1700);
}

/*
  The entire collage stays hidden until
  every image has loaded and decoded.
*/

Promise.all(images.map(prepareImage)).then(results=>{
  if(!results.every(Boolean)){
    console.error(
      "INTEGUMENTS: Missing images:",
      images.filter(img=>!img.naturalWidth).map(img=>img.src)
    );
    return;
  }

  requestAnimationFrame(()=>{
    collage.classList.add("ready");

    requestAnimationFrame(()=>{
      startColors();
    });
  });
});

/* PAUSE ANIMATION WHEN TAB IS HIDDEN */

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    clearTimeout(startTimer);
    clearInterval(colorTimer);
    colorTimer=null;
    started=false;
  }else if(collage.classList.contains("ready")){
    startColors();
  }
});

if("scrollRestoration" in history){
  history.scrollRestoration="manual";
}

window.scrollTo(0,0);

</script>
