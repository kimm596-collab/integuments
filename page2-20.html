
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTEGUMENTS — 2-20</title>

<style>
*{box-sizing:border-box}

html{
  background:#000;
  scroll-behavior:auto;
}

body{
  margin:0;
  background:#000;
  color:#a90000;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

.site-logo{
  position:fixed;
  top:42px;
  right:34px;
  width:220px;
  z-index:3000;
  display:block;
}

.site-logo img{
  display:block;
  width:100%;
  height:auto;
}

.opening{
  position:relative;
  height:115vh;
  min-height:780px;
  background:#000;
}

.poem-group{
  position:absolute;
  left:15.3%;
  top:calc(100vh - 175px);
  width:min(48vw,610px);
  pointer-events:none;
}

.poem-space{
  position:relative;
  width:100%;
  isolation:isolate;
}

.poem-original{
  position:relative;
  display:block;
  width:100%;
  height:auto;
  visibility:hidden;
}

.language-layer{
  position:absolute;
  inset:0;
  opacity:1;
  will-change:opacity;
  pointer-events:none;
}

/* INDEPENDENT HOVER AREAS */

.korean-layer{
  z-index:12;
}

.english-layer{
  z-index:20;
  transform:translateY(55px);
  filter:brightness(1.85) saturate(1.3);
}

.text-original{
  position:absolute;
  inset:0;
  z-index:10;
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
}

/* PAGE2-6 TEXT ECHO */

.text-echo{
  position:absolute;
  inset:0;
  z-index:5;
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;

  opacity:0;
  transform:translate(0,0);

  transition:opacity 750ms ease-in-out;

  animation:echoDrift 4.4s ease-in-out infinite alternate;
  animation-play-state:paused;

  filter:
    drop-shadow(0 0 4px rgba(230,0,0,.58))
    drop-shadow(0 0 8px rgba(180,0,0,.22));
}

/* ENGLISH — STRONGER MOVEMENT */

.english-layer.is-hovered .text-echo{
  opacity:.82;
  animation-play-state:running;
}

@keyframes echoDrift{
  0%{
    transform:translate(5px,3px);
  }
  50%{
    transform:translate(14px,-5px);
  }
  100%{
    transform:translate(7px,8px);
  }
}

/* KOREAN — GENTLER MOVEMENT */

.korean-layer .text-echo{
  animation:echoDriftKorean 6s ease-in-out infinite alternate;
  animation-play-state:paused;

  filter:
    drop-shadow(0 0 3px rgba(230,0,0,.42))
    drop-shadow(0 0 6px rgba(180,0,0,.15));
}

.korean-layer.is-hovered .text-echo{
  opacity:.65;
  animation-play-state:running;
}

@keyframes echoDriftKorean{
  0%{
    transform:translate(3px,2px);
  }
  50%{
    transform:translate(7px,-2px);
  }
  100%{
    transform:translate(4px,4px);
  }
}

/* FILM */

.film-section{
  position:relative;
  height:72dvh;
  min-height:0;
  overflow:hidden;
  background:#000;
}

.film-stage{
  position:absolute;
  inset:0;
  perspective:1000px;
  perspective-origin:50% 50%;
  overflow:hidden;
  isolation:isolate;
  opacity:0;
  transition:opacity 1100ms ease-in-out;
}

.film-stage.revealed{
  opacity:1;
}

.film-item{
  position:absolute;
  top:22dvh;
  left:50%;
  width:max-content;
  height:300px;
  transform-origin:center;
  backface-visibility:hidden;
  will-change:transform,opacity,filter;
  pointer-events:none;
}

.film-item img{
  display:block;
  width:auto;
  height:100%;
  max-width:none;
  object-fit:contain;
  backface-visibility:hidden;
}

html.film-locked{
  scroll-behavior:auto!important;
  overscroll-behavior:none;
}

body.film-locked{
  overscroll-behavior:none;
  touch-action:none;
}

/* RETURN */

.return-scene{
  position:fixed;
  inset:0;
  z-index:5000;
  overflow:hidden;
  background:transparent;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.return-scene.active{
  visibility:visible;
  opacity:1;
}

.return-catalogue{
  position:absolute;
  inset:0;
  opacity:0;
  will-change:opacity;
}

.return-tile{
  position:absolute;
  overflow:hidden;
  background:#000;
}

.return-tile img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.return-flight{
  position:fixed;
  left:0;
  top:0;
  z-index:5100;
  overflow:hidden;
  pointer-events:none;
  transform-origin:top left;
  will-change:transform,width,height;
}

.return-flight img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

@media(max-width:700px){
  .site-logo{
    top:26px;
    right:20px;
    width:170px;
  }

  .opening{
    height:115vh;
    min-height:700px;
  }

  .poem-group{
    left:9%;
    top:calc(100vh - 165px);
    width:75vw;
  }

  .english-layer{
    transform:translateY(45px);
  }

  .film-section{
    height:75dvh;
  }

  .film-item{
    top:25dvh;
    height:200px;
  }
}

@media(prefers-reduced-motion:reduce){
  .text-echo{
    animation:none;
  }
}
</style>

<body>

<a href="index.html" class="site-logo" aria-label="Home">
  <img src="integuments-red-logo.png" alt="INTEGUMENTS">
</a>

<section class="opening" id="opening">

  <div class="poem-group" id="poem-group">
    <div class="poem-space" id="poem-space">

      <img
        src="2-20 text.png?v=5"
        class="poem-original"
        id="poem-original"
        alt="Korean and English poem"
      >

      <div class="language-layer korean-layer" id="korean-text">
        <img
          class="text-echo"
          id="korean-echo"
          alt=""
          aria-hidden="true"
        >
        <img
          class="text-original"
          id="korean-original"
          alt=""
        >
      </div>

      <div class="language-layer english-layer" id="english-text">
        <img
          class="text-echo"
          id="english-echo"
          alt=""
          aria-hidden="true"
        >
        <img
          class="text-original"
          id="english-original"
          alt=""
        >
      </div>

    </div>
  </div>

</section>

<section class="film-section" id="film-section">
  <div class="film-stage" id="film-stage"></div>
</section>

<div class="return-scene" id="return-scene">
  <div class="return-catalogue" id="return-catalogue"></div>
</div>

<script>

/* HELPERS */

function clamp(value,min=0,max=1){
  return Math.max(min,Math.min(max,value));
}

function smoothstep(value){
  const t=clamp(value);
  return t*t*(3-2*t);
}

function easeInOutCubic(t){
  t=clamp(t);
  return t<.5
    ?4*t*t*t
    :1-Math.pow(-2*t+2,3)/2;
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

/* ELEMENTS */

const poemOriginal=document.getElementById("poem-original");
const poemGroup=document.getElementById("poem-group");
const poemSpace=document.getElementById("poem-space");

const koreanOriginal=document.getElementById("korean-original");
const englishOriginal=document.getElementById("english-original");

const koreanEcho=document.getElementById("korean-echo");
const englishEcho=document.getElementById("english-echo");

const koreanText=document.getElementById("korean-text");
const englishText=document.getElementById("english-text");

const opening=document.getElementById("opening");
const section=document.getElementById("film-section");
const stage=document.getElementById("film-stage");

const returnScene=document.getElementById("return-scene");
const returnCatalogue=document.getElementById("return-catalogue");

/* LANGUAGE REGIONS */

const KOREAN_END=.70;
const ENGLISH_START=.72;

/* EXTRACT RED TEXT */

function prepareTextLayers(){

  if(!poemOriginal.complete||!poemOriginal.naturalWidth){
    return false;
  }

  const W=poemOriginal.naturalWidth;
  const H=poemOriginal.naturalHeight;

  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;

  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(poemOriginal,0,0);

  let data;

  try{
    data=ctx.getImageData(0,0,W,H);
  }catch(error){
    console.warn("Could not prepare poem:",error);
    poemOriginal.style.visibility="visible";
    return false;
  }

  const korean=ctx.createImageData(W,H);
  const english=ctx.createImageData(W,H);

  const koreanLimit=Math.floor(H*KOREAN_END);
  const englishLimit=Math.floor(H*ENGLISH_START);

  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){

      const i=(y*W+x)*4;

      const r=data.data[i];
      const g=data.data[i+1];
      const b=data.data[i+2];
      const a=data.data[i+3];

      const isRed=
        a>20&&
        r>35&&
        r>g*1.35&&
        r>b*1.35;

      if(!isRed)continue;

      const target=
        y<koreanLimit?korean:
        y>=englishLimit?english:
        null;

      if(!target)continue;

      target.data[i]=r;
      target.data[i+1]=g;
      target.data[i+2]=b;
      target.data[i+3]=a;
    }
  }

  function imageURL(imageData){
    const c=document.createElement("canvas");
    c.width=W;
    c.height=H;
    c.getContext("2d").putImageData(imageData,0,0);
    return c.toDataURL("image/png");
  }

  koreanOriginal.src=imageURL(korean);
  englishOriginal.src=imageURL(english);

  return true;
}

/* PAGE2-6 ECHO IMAGES */

function buildAllShadows(){
  if(koreanOriginal.src){
    koreanEcho.src=koreanOriginal.src;
  }
  if(englishOriginal.src){
    englishEcho.src=englishOriginal.src;
  }
}

koreanOriginal.addEventListener("load",()=>{
  koreanEcho.src=koreanOriginal.src;
  updateOpeningHeight();
});

englishOriginal.addEventListener("load",()=>{
  englishEcho.src=englishOriginal.src;
  updateOpeningHeight();
});

poemOriginal.addEventListener("load",()=>{
  prepareTextLayers();
  updateOpeningHeight();
});

if(poemOriginal.complete&&poemOriginal.naturalWidth){
  prepareTextLayers();
}

/* INDEPENDENT HOVER DETECTION */

let koreanHoverBounds=null;
let englishHoverBounds=null;

function getRedPixelBounds(image){

  if(!image.complete||!image.naturalWidth){
    return null;
  }

  const W=image.naturalWidth;
  const H=image.naturalHeight;

  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;

  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(image,0,0);

  let data;

  try{
    data=ctx.getImageData(0,0,W,H).data;
  }catch(error){
    return null;
  }

  let minX=W;
  let minY=H;
  let maxX=-1;
  let maxY=-1;

  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const i=(y*W+x)*4;

      if(data[i+3]>50&&data[i]>60){
        minX=Math.min(minX,x);
        minY=Math.min(minY,y);
        maxX=Math.max(maxX,x);
        maxY=Math.max(maxY,y);
      }
    }
  }

  if(maxX<minX||maxY<minY){
    return null;
  }

  return {
    minX:minX/W,
    minY:minY/H,
    maxX:maxX/W,
    maxY:maxY/H
  };
}

function updateHoverBounds(){
  koreanHoverBounds=getRedPixelBounds(koreanOriginal);
  englishHoverBounds=getRedPixelBounds(englishOriginal);
}

koreanOriginal.addEventListener("load",updateHoverBounds);
englishOriginal.addEventListener("load",updateHoverBounds);

function pointerInsideText(event,layer,bounds){

  if(!bounds)return false;

  const rect=layer.getBoundingClientRect();

  const padding=12;

  const left=rect.left+bounds.minX*rect.width-padding;
  const right=rect.left+bounds.maxX*rect.width+padding;
  const top=rect.top+bounds.minY*rect.height-padding;
  const bottom=rect.top+bounds.maxY*rect.height+padding;

  return (
    event.clientX>=left&&
    event.clientX<=right&&
    event.clientY>=top&&
    event.clientY<=bottom
  );
}

function handleIndependentHover(event){

  const overKorean=pointerInsideText(
    event,koreanText,koreanHoverBounds
  );

  const overEnglish=pointerInsideText(
    event,englishText,englishHoverBounds
  );

  koreanText.classList.toggle(
    "is-hovered",overKorean&&!overEnglish
  );

  englishText.classList.toggle(
    "is-hovered",overEnglish
  );
}

window.addEventListener("pointermove",handleIndependentHover,{
  passive:true
});

window.addEventListener("pointerleave",()=>{
  koreanText.classList.remove("is-hovered");
  englishText.classList.remove("is-hovered");
});

/* OPENING HEIGHT */

function updateOpeningHeight(){

  const poemBottom=
    poemGroup.offsetTop+
    poemGroup.offsetHeight;

  opening.style.height=Math.max(
    innerHeight*1.15,
    poemBottom+innerHeight*.20+55
  )+"px";
}

/* TEXT FADE */

function updateTextScroll(){

  const viewport=window.innerHeight;

  const openingBottom=
    opening.offsetTop+opening.offsetHeight;

  const fadeStart=
    openingBottom-viewport*.75;

  const fadeEnd=
    openingBottom-viewport*.30;

  const fadeProgress=smoothstep(
    (window.scrollY-fadeStart)/
    (fadeEnd-fadeStart)
  );

  koreanText.style.opacity=1-fadeProgress;
  englishText.style.opacity=1-fadeProgress;

  return fadeProgress;
}

/* FILM IMAGES */

const images=[
  "guillem.jpg",
  "body.jpg",
  "jamie.jpg",
  "abreale1.jpg",
  "light1.jpg",
  "annecy.jpg",
  "paris.jpg",
  "spiral.jpg",
  "abreale2.jpg",
  "soho.jpg",
  "abreale3.jpg",
  "abreale4.jpg",
  "poles.jpg",
  "light2.jpg",
  "abreale5.jpg",
  "amsterdam.jpg",
  "morris.jpg",
  "abreale6.jpg",
  "ice.jpg",
  "abreale7.jpg",
  "nyc.jpg"
];

const cards=images.map(filename=>{

  const card=document.createElement("div");
  card.className="film-item";

  const img=document.createElement("img");
  img.src=filename;
  img.alt=filename;
  img.draggable=false;

  card.appendChild(img);
  stage.appendChild(card);

  return card;
});

const total=cards.length;

/* 2-20 ENDS ON ABREALE7.JPG */

const FOCUS_INDEX=19;
const FOCUS_IMAGE="abreale7.jpg";

const RUN_DURATION=3200;
const EXPAND_DURATION=1800;
const HOLD_DURATION=300;
const RETURN_DURATION=2000;

let animationStarted=false;
let animationStart=null;
let currentPosition=FOCUS_INDEX;
let finished=false;
let expanding=false;
let expansionProgress=0;
let scrollLocked=false;
let returning=false;

/* LOCK SCROLL DURING FILM */

window.addEventListener("wheel",e=>{
  if(scrollLocked)e.preventDefault();
},{
  passive:false,
  capture:true
});

window.addEventListener("touchmove",e=>{
  if(scrollLocked)e.preventDefault();
},{
  passive:false,
  capture:true
});

window.addEventListener("keydown",e=>{
  if(scrollLocked&&[
    "ArrowUp",
    "ArrowDown",
    "ArrowLeft",
    "ArrowRight",
    "PageUp",
    "PageDown",
    "Home",
    "End",
    " ",
    "Spacebar"
  ].includes(e.key)){
    e.preventDefault();
  }
},{capture:true});

/* FILM RENDERING */

function getDistance(index,position){

  let distance=index-position;

  while(distance<-total/2){
    distance+=total;
  }

  while(distance>total/2){
    distance-=total;
  }

  return distance;
}

function updateRevealMask(img,distance){

  const reveal=smoothstep(
    (distance+.35)/1.65
  );

  const width=45*reveal;

  if(width<.1){
    img.style.webkitMaskImage="none";
    img.style.maskImage="none";
    return;
  }

  const gradient=`linear-gradient(
    to right,
    transparent 0%,
    rgba(0,0,0,.12) ${width*.18}%,
    rgba(0,0,0,.32) ${width*.40}%,
    rgba(0,0,0,.62) ${width*.68}%,
    rgba(0,0,0,.85) ${width*.88}%,
    black ${width}%,
    black 100%
  )`;

  img.style.webkitMaskImage=gradient;
  img.style.maskImage=gradient;
}

function render(position,finalMode=false,expansion=0){

  currentPosition=position;

  const mobile=window.innerWidth<=700;
  const spacing=mobile?112:175;
  const baseHeight=mobile?200:300;

  cards.forEach((card,index)=>{

    const distance=getDistance(
      index,
      finalMode?FOCUS_INDEX:position
    );

    const abs=Math.abs(distance);
    const x=distance*spacing;
    const y=Math.min(abs*abs*3.5,65);
    const z=-abs*125;

    const rotateY=clamp(
      -distance*15,-65,65
    );

    const scale=Math.max(
      .55,1-abs*.055
    );

    const opacity=clamp(
      1-abs*.095
    );

    const brightness=clamp(
      1-abs*.085,.22,1
    );

    const img=card.querySelector("img");

    card.style.height=baseHeight+"px";

    updateRevealMask(img,distance);

    card.style.opacity=opacity;
    card.style.filter=
      `brightness(${brightness})`;

    card.style.transform=`
      translate(-50%,-50%)
      translate3d(${x}px,${y}px,${z}px)
      rotateY(${rotateY}deg)
      scale(${scale})
    `;

    card.style.zIndex=String(
      1000-Math.round(abs*10)
    );

    card.style.visibility=
      opacity<=0?"hidden":"visible";
  });

  if(finalMode){

    const focus=cards[FOCUS_INDEX];
    const img=focus.querySelector("img");
    const eased=easeInOutCubic(expansion);

    const sectionHeight=section.clientHeight;

    const centerY=mobile
      ?window.innerHeight*.25
      :window.innerHeight*.22;

    const safeHeight=Math.max(
      100,
      Math.min(
        sectionHeight*.70,
        centerY*2-24,
        (sectionHeight-centerY)*2-24
      )
    );

    const finalHeight=mobile
      ?Math.min(safeHeight,380)
      :Math.min(safeHeight,476);

    focus.style.height=(
      baseHeight+
      (finalHeight-baseHeight)*eased
    )+"px";

    img.style.webkitMaskImage="none";
    img.style.maskImage="none";

    focus.style.transform=`
      translate(-50%,-50%)
      translate3d(0,0,0)
      rotateY(0deg)
      scale(1)
    `;

    focus.style.opacity="1";
    focus.style.filter="brightness(1)";
    focus.style.zIndex="1100";
    focus.style.visibility="visible";
  }
}

render(FOCUS_INDEX);

/* FILM ANIMATION */

function lockFilmScroll(){

  if(scrollLocked)return;

  scrollLocked=true;

  document.documentElement.classList.add(
    "film-locked"
  );

  document.body.classList.add(
    "film-locked"
  );
}

function startFilmAnimation(){

  if(animationStarted)return;

  animationStarted=true;

  lockFilmScroll();
  stage.classList.add("revealed");

  animationStart=performance.now();

  requestAnimationFrame(animateFilm);
}

function animateFilm(now){

  const elapsed=now-animationStart;

  if(elapsed<RUN_DURATION){

    render(
      FOCUS_INDEX+
      (elapsed/RUN_DURATION)*total
    );

    requestAnimationFrame(animateFilm);
    return;
  }

  expanding=true;

  expansionProgress=clamp(
    (elapsed-RUN_DURATION)/
    EXPAND_DURATION
  );

  render(
    FOCUS_INDEX+total,
    true,
    expansionProgress
  );

  if(expansionProgress<1){
    requestAnimationFrame(animateFilm);
  }else{

    finished=true;

    render(
      FOCUS_INDEX+total,
      true,
      1
    );

    setTimeout(
      startSeamlessReturn,
      HOLD_DURATION
    );
  }
}

/* CATALOGUE */

const catalogueTiles=[
  ["guillem.jpg",0,0,12.2,27.5],
  ["body.jpg",12.2,0,23.4,27.5],
  ["jamie.jpg",35.6,0,12.2,27.5],
  ["abreale1.jpg",47.8,0,27.8,27.5],
  ["light1.jpg",75.6,0,24.4,27.5],

  ["annecy.jpg",0,27.5,14.2,33],
  ["paris.jpg",14.2,27.5,14.2,33],
  ["spiral.jpg",28.4,27.5,12.6,33],
  ["abreale2.jpg",41,27.5,12.8,33],
  ["soho.jpg",53.8,27.5,29.2,33],
  ["abreale3.jpg",83,27.5,17,33],

  ["abreale4.jpg",0,60.5,32.6,39.5],
  ["poles.jpg",32.6,60.5,14.6,17],
  ["light2.jpg",47.2,60.5,14.4,17],
  ["abreale6.jpg",61.6,60.5,15.6,17],
  ["amsterdam.jpg",77.2,60.5,10.2,17],
  ["nyc.jpg",87.4,60.5,12.6,39.5],

  ["morris.jpg",32.6,77.5,16,22.5],
  ["abreale5.jpg",48.6,77.5,10.5,22.5],
  ["ice.jpg",59.1,77.5,18.1,22.5],
  ["abreale7.jpg",77.2,77.5,10.2,22.5]
];

catalogueTiles.forEach(([src,x,y,w,h])=>{

  const tile=document.createElement("div");
  tile.className="return-tile";

  tile.style.left=x+"%";
  tile.style.top=y+"%";
  tile.style.width=w+"%";
  tile.style.height=h+"%";

  if(src!==FOCUS_IMAGE){

    const img=document.createElement("img");
    img.src=src;
    img.alt="";

    if([
      "body.jpg",
      "abreale1.jpg",
      "abreale3.jpg"
    ].includes(src)){
      img.style.objectPosition="50% 45%";
    }

    tile.appendChild(img);
  }

  returnCatalogue.appendChild(tile);
});

/* RETURN ABREALE7.JPG TO ITS TILE */

function startSeamlessReturn(){

  if(returning)return;
  returning=true;

  const focusCard=cards[FOCUS_INDEX];

  const origin=focusCard
    .querySelector("img")
    .getBoundingClientRect();

  const destination={
    left:window.innerWidth*.772,
    top:window.innerHeight*.775,
    width:window.innerWidth*.102,
    height:window.innerHeight*.225
  };

  const flying=document.createElement("div");
  flying.className="return-flight";

  const picture=document.createElement("img");
  picture.src=FOCUS_IMAGE;
  picture.alt="";

  flying.appendChild(picture);
  returnScene.appendChild(flying);

  flying.style.width=origin.width+"px";
  flying.style.height=origin.height+"px";

  flying.style.transform=`
    translate3d(
      ${origin.left}px,
      ${origin.top}px,
      0
    )
  `;

  returnScene.classList.add("active");

  focusCard.style.visibility="hidden";

  const start=performance.now();

  function animateReturn(now){

    const t=clamp(
      (now-start)/RETURN_DURATION
    );

    const eased=easeInOutCubic(t);

    stage.style.opacity=String(
      1-smoothstep(t/.65)
    );

    returnCatalogue.style.opacity=String(
      smoothstep((t-.10)/.70)
    );

    const x=lerp(
      origin.left,
      destination.left,
      eased
    );

    const lift=Math.sin(Math.PI*t)*38;

    const y=lerp(
      origin.top,
      destination.top,
      eased
    )-lift;

    const w=lerp(
      origin.width,
      destination.width,
      eased
    );

    const h=lerp(
      origin.height,
      destination.height,
      eased
    );

    flying.style.width=w+"px";
    flying.style.height=h+"px";

    flying.style.transform=`
      translate3d(${x}px,${y}px,0)
    `;

    if(t<1){
      requestAnimationFrame(animateReturn);
    }else{

      returnCatalogue.style.opacity="1";

      try{
        sessionStorage.removeItem(
          "integuments-return-flight"
        );

        sessionStorage.setItem(
          "integuments-seamless-arrival",
          JSON.stringify({
            image:FOCUS_IMAGE,
            time:Date.now()
          })
        );
      }catch(error){}

      window.location.replace("page2.html");
    }
  }

  requestAnimationFrame(animateReturn);
}

/* SCROLL */

let scrollPending=false;

function requestScrollUpdate(){

  if(scrollPending)return;
  scrollPending=true;

  requestAnimationFrame(()=>{
    scrollPending=false;
    updateScrollEffects();
  });
}

function updateScrollEffects(){

  if(scrollLocked)return;

  const fadeProgress=updateTextScroll();

  const restingTop=Math.max(
    0,
    window.innerHeight-section.offsetHeight
  );

  const currentTop=
    section.offsetTop-window.scrollY;

  if(
    fadeProgress>=.999&&
    currentTop<=restingTop+2
  ){
    startFilmAnimation();
  }
}

window.addEventListener(
  "scroll",
  requestScrollUpdate,
  {passive:true}
);

/* RESIZE */

let resizeTimer;

window.addEventListener("resize",()=>{

  updateOpeningHeight();

  clearTimeout(resizeTimer);

  resizeTimer=setTimeout(()=>{
    buildAllShadows();
    updateHoverBounds();
  },250);

  if(!scrollLocked){
    requestScrollUpdate();
  }

  if(finished){
    render(
      FOCUS_INDEX+total,
      true,
      1
    );
  }else if(expanding){
    render(
      FOCUS_INDEX+total,
      true,
      expansionProgress
    );
  }else{
    render(currentPosition);
  }
});

/* INITIALIZE */

window.addEventListener("load",()=>{
  updateOpeningHeight();
  buildAllShadows();
  updateHoverBounds();
  requestScrollUpdate();
});

updateOpeningHeight();
requestScrollUpdate();

</script>
