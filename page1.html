
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTEGUMENTS</title>

<style>
:root{
  --red:#E60000;
  --red-filter:grayscale(1) sepia(1) saturate(9)
    hue-rotate(320deg) brightness(.93) contrast(1.1);
}

*{
  box-sizing:border-box;
}

html{
  margin:0;
  background:var(--red);
  scroll-behavior:auto;
  overscroll-behavior-y:none;
}

body{
  margin:0;
  min-height:240vh;
  min-height:240dvh;
  overflow-x:hidden;
  background:var(--red);
  overscroll-behavior-y:none;
}

.scene{
  position:fixed;
  inset:0;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  isolation:isolate;
  background:var(--red);
}

/* RED OPENING */

.intro{
  position:absolute;
  inset:0;
  z-index:5;
  background:var(--red);
  opacity:1;
  pointer-events:none;
}

.title-position{
  position:absolute;
  left:0;
  right:0;
  bottom:3%;
}

.intro-title{
  position:relative;
  display:block;
  width:max-content;
  margin:0;
  padding:0;

  font-family:
    "Helvetica Neue Condensed Bold",
    "HelveticaNeue-CondensedBold",
    "Helvetica Neue",
    "Arial Narrow",
    Arial,
    sans-serif;

  font-weight:900;
  font-stretch:condensed;
  font-size:clamp(100px,18vw,400px);
  line-height:.82;
  letter-spacing:-.065em;
  white-space:nowrap;
  color:#a50000;

  text-shadow:
    0 -1px 0 rgba(75,0,0,.65),
    0 -2px 1px rgba(90,0,0,.32),
    -1px 0 0 rgba(100,0,0,.45),
    1px 0 0 rgba(255,35,35,.25),
    0 1px 0 rgba(255,48,48,.7),
    0 2px 1px rgba(255,45,45,.38),
    0 3px 3px rgba(90,0,0,.12);

  transform-origin:top left;
  user-select:none;
  will-change:transform,opacity;
}

/* COMPLETE PHOTOGRAPHY COLLAGE */

.collage{
  position:absolute;
  inset:0;
  z-index:10;
  overflow:hidden;
  background:var(--red);

  opacity:0;
  visibility:hidden;
  transform:scale(1.018);
  transform-origin:center;

  pointer-events:none;
  will-change:opacity,transform;
}

.collage-images{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:var(--red);

  filter:var(--red-filter);
  transition:none;
}

.tile{
  position:absolute;
  display:block;
  overflow:hidden;
  background:var(--red);
  text-decoration:none;
  cursor:pointer;
}

.tile img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  border:0;
  user-select:none;
  -webkit-user-drag:none;
}

.tile:focus-visible{
  outline:2px solid #fff;
  outline-offset:-2px;
  z-index:30;
}

/* EXACT 21-IMAGE COLLAGE LAYOUT */

.p01{left:0%;top:0%;width:12.2%;height:27.5%}
.p02{left:12.2%;top:0%;width:23.4%;height:27.5%}
.p03{left:35.6%;top:0%;width:12.2%;height:27.5%}
.p04{left:47.8%;top:0%;width:27.8%;height:27.5%}
.p05{left:75.6%;top:0%;width:24.4%;height:27.5%}

.p06{left:0%;top:27.5%;width:14.2%;height:33%}
.p07{left:14.2%;top:27.5%;width:14.2%;height:33%}
.p08{left:28.4%;top:27.5%;width:12.6%;height:33%}
.p09{left:41%;top:27.5%;width:12.8%;height:33%}
.p10{left:53.8%;top:27.5%;width:29.2%;height:33%}
.p11{left:83%;top:27.5%;width:17%;height:33%}

.p12{left:0%;top:60.5%;width:32.6%;height:39.5%}
.p13{left:32.6%;top:60.5%;width:14.6%;height:17%}
.p14{left:47.2%;top:60.5%;width:14.4%;height:17%}
.p15{left:61.6%;top:60.5%;width:15.6%;height:17%}
.p16{left:77.2%;top:60.5%;width:10.2%;height:17%}
.p17{left:87.4%;top:60.5%;width:12.6%;height:39.5%}

.p18{left:32.6%;top:77.5%;width:16%;height:22.5%}
.p19{left:48.6%;top:77.5%;width:10.5%;height:22.5%}
.p20{left:59.1%;top:77.5%;width:18.1%;height:22.5%}
.p21{left:77.2%;top:77.5%;width:10.2%;height:22.5%}

.p02 img,
.p04 img,
.p11 img{
  object-position:50% 45%;
}

@media(prefers-reduced-motion:reduce){
  .collage,
  .intro-title{
    will-change:auto;
  }

  .collage-images{
    transition:none!important;
  }
}
</style>
</head>

<body>

<main class="scene">

  <section class="intro" id="intro">
    <div class="title-position">
      <h1 class="intro-title" id="title">INTEGUMENTS</h1>
    </div>
  </section>

  <section class="collage" id="collage" aria-label="Photography catalogue">
    <div class="collage-images" id="collageImages">

      <a class="tile p01" href="page2-1.html"><img src="guillem.jpg" alt="Guillem"></a>
      <a class="tile p02" href="page2-2.html"><img src="body.jpg" alt="Body"></a>
      <a class="tile p03" href="page2-3.html"><img src="jamie.jpg" alt="Jamie"></a>

      <a class="tile p05" href="page2-5.html"><img src="light1.jpg" alt="Light 1"></a>

      <a class="tile p06" href="page2-6.html"><img src="annecy.jpg" alt="Annecy"></a>
      <a class="tile p07" href="page2-7.html"><img src="paris.jpg" alt="Paris"></a>

      <a class="tile p14" href="page2-15.html"><img src="light2.jpg" alt="Light 2"></a>
      <a class="tile p15" href="page2-17.html"><img src="abreale6.jpg" alt="Abreale 6"></a>
      <a class="tile p16" href="page2-19.html"><img src="amsterdam.jpg" alt="Amsterdam"></a>
      <a class="tile p17" href="page2-21.html"><img src="nyc.jpg" alt="NYC"></a>

      <a class="tile p18" href="page2-14.html"><img src="morris.jpg" alt="Morris"></a>

      <a class="tile p21" href="page2-20.html"><img src="abreale7.jpg" alt="Abreale 7"></a>

    </div>
  </section>

</main>

<script>
"use strict";

const intro=document.getElementById("intro");
const title=document.getElementById("title");
const collage=document.getElementById("collage");
const collageImages=document.getElementById("collageImages");
const images=[...collage.querySelectorAll("img")];

const RED="grayscale(1) sepia(1) saturate(9) hue-rotate(320deg) brightness(.93) contrast(1.1)";
const BW="grayscale(1) sepia(0) saturate(1) brightness(1.04)";
const BLUE="grayscale(1) sepia(.30) hue-rotate(165deg) saturate(.85) brightness(1.02)";
const GREEN="grayscale(1) sepia(.38) hue-rotate(95deg) saturate(.9) brightness(.99)";
const PURPLE="grayscale(1) sepia(.30) hue-rotate(235deg) saturate(.75) brightness(1)";
const WARM="grayscale(1) sepia(.25) hue-rotate(0deg) saturate(.75) brightness(.98)";

const colors=[
  RED,BW,RED,BLUE,RED,GREEN,
  RED,PURPLE,RED,WARM,RED
];

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{
  t=clamp(t);
  return t*t*(3-2*t);
};

let titleScale=1;
let titleLeft=0;
let frame=0;
let allReady=false;
let requestedProgress=0;
let visibleProgress=0;
let colorStarted=false;
let colorIndex=0;
let colorTimer=null;
let colorStartTimer=null;

/* IMAGE LOADING */

/*
  Keep the opening visible until every
  photograph has loaded and decoded.

  Never reveal an incomplete collage.
*/

function prepareImage(img){
  img.loading="eager";
  img.decoding="async";
  img.fetchPriority="high";

  return new Promise(resolve=>{
    function finish(){
      if(!img.naturalWidth){
        resolve(false);
        return;
      }

      if(typeof img.decode==="function"){
        img.decode()
          .then(()=>resolve(true))
          .catch(()=>resolve(true));
      }else{
        resolve(true);
      }
    }

    if(img.complete){
      finish();
    }else{
      img.addEventListener("load",finish,{once:true});
      img.addEventListener(
        "error",
        ()=>resolve(false),
        {once:true}
      );
    }
  });
}

Promise.all(images.map(prepareImage)).then(results=>{
  if(results.every(Boolean)){
    allReady=true;
    collage.style.visibility="visible";
    updateScroll();
  }else{
    console.error(
      "INTEGUMENTS: One or more photographs failed to load.",
      images.filter(img=>!img.naturalWidth).map(img=>img.src)
    );
  }
});

/* TITLE CENTERING */

function fitTitle(){
  title.style.transform="none";
  title.style.left="0px";

  const width=title.getBoundingClientRect().width;
  if(!width)return;

  const desired=window.innerWidth*.97;

  titleScale=desired/width;
  titleLeft=(window.innerWidth-desired)/2;

  title.style.left=titleLeft+"px";

  updateScroll();
}

/* SCROLL PROGRESS */

function getProgress(){
  const max=Math.max(
    1,
    document.documentElement.scrollHeight-
    window.innerHeight
  );

  return clamp(window.scrollY/max);
}

/*
  The scroll is always recorded immediately.

  The collage only becomes visible after
  all 21 photographs are ready.
*/

function updateScroll(){
  frame=0;

  requestedProgress=getProgress();

  if(!allReady){
    intro.style.opacity="1";
    collage.style.opacity="0";
    collage.style.pointerEvents="none";
    stopColors();
    return;
  }

  visibleProgress=requestedProgress;

  const reveal=ease(
    clamp((visibleProgress-.035)/.91)
  );

  collage.style.opacity=String(reveal);
  collage.style.transform=
    `scale(${1.018-reveal*.018})`;

  intro.style.opacity=String(1-reveal);

  title.style.transform=
    `translateY(${-visibleProgress*35}px) scaleX(${titleScale})`;

  title.style.opacity=String(
    1-ease(clamp(visibleProgress/.78))
  );

  const fullyOpen=visibleProgress>=.995;

  collage.style.pointerEvents=
    fullyOpen?"auto":"none";

  if(fullyOpen){
    startColors();
  }else{
    stopColors();
  }
}

function onScroll(){
  if(frame)return;
  frame=requestAnimationFrame(updateScroll);
}

/* COLOR TRANSITIONS */

function nextColor(){
  colorIndex=(colorIndex+1)%colors.length;
  collageImages.style.filter=colors[colorIndex];
}

function startColors(){
  if(colorStarted)return;

  colorStarted=true;
  colorIndex=0;

  collageImages.style.transition="none";
  collageImages.style.filter=RED;

  colorStartTimer=setTimeout(()=>{
    if(!colorStarted)return;

    collageImages.style.transition=
      "filter 2000ms cubic-bezier(.45,0,.55,1)";

    nextColor();

    colorTimer=setInterval(
      nextColor,
      2300
    );
  },1700);
}

function stopColors(){
  if(!colorStarted)return;

  colorStarted=false;

  clearTimeout(colorStartTimer);
  clearInterval(colorTimer);

  colorStartTimer=null;
  colorTimer=null;

  colorIndex=0;
  collageImages.style.transition="none";
  collageImages.style.filter=RED;
}

/* INITIALIZE */

if("scrollRestoration" in history){
  history.scrollRestoration="manual";
}

window.scrollTo(0,0);

window.addEventListener(
  "scroll",
  onScroll,
  {passive:true}
);

window.addEventListener(
  "resize",
  fitTitle,
  {passive:true}
);

window.addEventListener("pageshow",()=>{
  fitTitle();
  updateScroll();
});

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    stopColors();
  }else{
    updateScroll();
  }
});

fitTitle();
updateScroll();

document.fonts.ready.then(fitTitle);

</script>

</body>
</html>
