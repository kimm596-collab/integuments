
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTEGUMENTS — Opening</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#1e1e1e;
}

html{
  scroll-behavior:auto;
  overscroll-behavior-y:none;
}

body{
  height:240vh;
  height:240dvh;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}

/* FIXED FULL-SCREEN PAGE */

.page1{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#1e1e1e;
  isolation:isolate;
}

/* ORIGINAL RED INTRO */

.intro{
  position:absolute;
  inset:0;
  z-index:5;
  width:100%;
  height:100%;
  background:#E60000;
  overflow:hidden;
  will-change:opacity;
}

/* CENTERED TITLE POSITION */

.title-position{
  position:absolute;
  left:0;
  right:0;
  bottom:3%;
  height:auto;
  overflow:visible;
  pointer-events:none;
}

/* MATTE EMBOSSED TITLE */

.intro-title{
  position:relative;
  display:block;
  width:max-content;
  max-width:none;
  margin:0;
  padding:0;

  font-family:
    "Helvetica Neue Condensed Bold",
    "HelveticaNeue-CondensedBold",
    "Helvetica Neue",
    "Arial Narrow",
    Arial,
    sans-serif;

  font-weight:900;
  font-stretch:condensed;
  font-size:clamp(100px,18vw,400px);
  line-height:.82;
  letter-spacing:-.065em;
  white-space:nowrap;

  color:#a50000;

  text-shadow:
    0 -1px 0 rgba(75,0,0,.65),
    0 -2px 1px rgba(90,0,0,.32),
    -1px 0 0 rgba(100,0,0,.45),
    1px 0 0 rgba(255,35,35,.25),
    0 1px 0 rgba(255,48,48,.7),
    0 2px 1px rgba(255,45,45,.38),
    0 3px 3px rgba(90,0,0,.12);

  transform-origin:top left;
  user-select:none;
  will-change:transform,opacity;
}

/* ORIGINAL COLLAGE */

.collage{
  position:absolute;
  inset:0;
  z-index:10;
  width:100%;
  height:100%;
  overflow:hidden;
  visibility:hidden;
  opacity:0;
  filter:none;
  transform:scale(1.035);
  transform-origin:center center;
  will-change:filter,opacity,transform;
  pointer-events:none;
}

.collage.is-ready{
  visibility:visible;
}

.tile{
  position:absolute;
  display:block;
  overflow:hidden;
  text-decoration:none;
  cursor:default;
  pointer-events:none;
}

.tile img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  transform:none;
  border:0;
  user-select:none;
  -webkit-user-drag:none;
}

/* ORIGINAL TOP ROW */

.p01{left:0%;top:0%;width:12.2%;height:27.5%}
.p02{left:12.2%;top:0%;width:23.4%;height:27.5%}
.p03{left:35.6%;top:0%;width:12.2%;height:27.5%}
.p04{left:47.8%;top:0%;width:27.8%;height:27.5%}
.p05{left:75.6%;top:0%;width:24.4%;height:27.5%}

/* ORIGINAL MIDDLE ROW */

.p06{left:0%;top:27.5%;width:14.2%;height:33%}
.p07{left:14.2%;top:27.5%;width:14.2%;height:33%}
.p08{left:28.4%;top:27.5%;width:12.6%;height:33%}
.p09{left:41%;top:27.5%;width:12.8%;height:33%}
.p10{left:53.8%;top:27.5%;width:29.2%;height:33%}
.p11{left:83%;top:27.5%;width:17%;height:33%}

/* ORIGINAL BOTTOM SECTION */

.p12{left:0%;top:60.5%;width:32.6%;height:39.5%}
.p13{left:32.6%;top:60.5%;width:14.6%;height:17%}
.p14{left:47.2%;top:60.5%;width:14.4%;height:17%}
.p15{left:61.6%;top:60.5%;width:15.6%;height:17%}
.p16{left:77.2%;top:60.5%;width:10.2%;height:17%}
.p17{left:87.4%;top:60.5%;width:12.6%;height:39.5%}

/* ORIGINAL BOTTOM STRIP */

.p18{left:32.6%;top:77.5%;width:16%;height:22.5%}
.p19{left:48.6%;top:77.5%;width:10.5%;height:22.5%}
.p20{left:59.1%;top:77.5%;width:18.1%;height:22.5%}
.p21{left:77.2%;top:77.5%;width:10.2%;height:22.5%}

/* ORIGINAL IMAGE CROPPING */

.p01 img{object-position:50% 50%}
.p02 img{object-position:50% 45%}
.p03 img{object-position:50% 50%}
.p04 img{object-position:50% 45%}
.p05 img{object-position:50% 50%}
.p06 img{object-position:50% 50%}
.p07 img{object-position:50% 50%}
.p08 img{object-position:50% 50%}
.p09 img{object-position:50% 50%}
.p10 img{object-position:50% 50%}
.p11 img{object-position:50% 45%}
.p12 img{object-position:50% 50%}
.p13 img{object-position:50% 50%}
.p14 img{object-position:50% 50%}
.p15 img{object-fit:cover;object-position:center center}
.p16 img{object-position:50% 50%}
.p17 img{object-position:50% 50%}
.p18 img{object-position:50% 50%}
.p19 img{object-position:50% 50%}
.p20 img{object-position:50% 50%}
.p21 img{object-fit:cover;object-position:center center}

</style>
</head>

<body>

<main class="page1">

  <!-- RED OPENING SCREEN -->

  <section class="intro" id="intro">
    <div class="title-position">
      <h1 class="intro-title" id="introTitle">INTEGUMENTS</h1>
    </div>
  </section>

  <!-- ORIGINAL PHOTOGRAPHY COLLAGE -->

  <div class="collage" id="collage">

    <div class="tile p01">
      <img src="guillem.jpg" alt="Guillem">
    </div>

    <div class="tile p02">
      <img src="body.jpg" alt="Body">

    <div class="tile p03">

      <img src="light2.jpg" alt="Light 2">

    <div class="tile p15">
      <img src="abreale6.jpg" alt="Abreale 6">
    </div>

    <div class="tile p16">
      <img src="amsterdam.jpg" alt="Amsterdam">
    </div>

    <div class="tile p17">
      <img src="nyc.jpg" alt="NYC">
    </div>

    <div class="tile p18">
      <img src="morris.jpg" alt="Morris">
    </div>

    <div class="tile p19">
      <img src="abreale5.jpg" alt="Abreale 5">

    </div>

    <div class="tile p21">
      <img src="abreale7.jpg" alt="Abreale 7">
    </div>

  </div>

</main>

<script>

/* ELEMENTS */

const collage=document.getElementById("collage");
const images=[...collage.querySelectorAll("img")];
const intro=document.getElementById("intro");
const introTitle=document.getElementById("introTitle");

/* PRECISE TITLE CENTERING USING ACTUAL RENDERED TEXT */

let titleScale=1;
let titleLeft=0;

function fitIntroTitle(){

  /* Measure the title as Chrome actually renders it,
     including its font, weight and letter spacing. */

  introTitle.style.transform="none";
  introTitle.style.left="0px";

  const actualWidth=introTitle.getBoundingClientRect().width;

  if(!actualWidth)return;

  /* Fill 97% of the viewport, with equal side margins. */

  const desiredWidth=window.innerWidth*.97;

  titleScale=desiredWidth/actualWidth;

  /* Center the scaled element, not a canvas estimate. */

  titleLeft=(window.innerWidth-desiredWidth)/2;

  introTitle.style.left=titleLeft+"px";

  updateVisuals();
}

/* ORIGINAL IMAGE LOADING */

function waitForImage(img){
  return new Promise(resolve=>{
    if(img.complete){
      resolve();
      return;
    }

    img.addEventListener("load",resolve,{once:true});
    img.addEventListener("error",resolve,{once:true});
  });
}

/* ORIGINAL COLOR PALETTES */

const originalRed={
  grayscale:0,
  sepia:0,
  hue:0,
  saturation:1,
  brightness:1
};

const blackWhite={
  grayscale:1,
  sepia:0,
  hue:0,
  saturation:1,
  brightness:1.04
};

const icyBlue={
  grayscale:1,
  sepia:.30,
  hue:165,
  saturation:.85,
  brightness:1.02
};

const emerald={
  grayscale:1,
  sepia:.38,
  hue:95,
  saturation:.9,
  brightness:.99
};

const mutedPurple={
  grayscale:1,
  sepia:.30,
  hue:235,
  saturation:.75,
  brightness:1
};

const warmMonochrome={
  grayscale:1,
  sepia:.25,
  hue:0,
  saturation:.75,
  brightness:.98
};

const colorStages=[
  originalRed,
  blackWhite,
  originalRed,
  icyBlue,
  originalRed,
  emerald,
  originalRed,
  mutedPurple,
  originalRed,
  warmMonochrome,
  originalRed
];

const transitionDuration=2000;

let transitionStart=null;
let currentStage=0;
let colorCycleStarted=false;

function lerp(a,b,t){
  return a+(b-a)*t;
}

function smoothstep(t){
  t=Math.max(0,Math.min(1,t));
  return t*t*(3-2*t);
}

function interpolateFilter(a,b,t){
  return {
    grayscale:lerp(a.grayscale,b.grayscale,t),
    sepia:lerp(a.sepia,b.sepia,t),
    hue:lerp(a.hue,b.hue,t),
    saturation:lerp(a.saturation,b.saturation,t),
    brightness:lerp(a.brightness,b.brightness,t)
  };
}

function filterToCSS(f){
  return `
    grayscale(${f.grayscale})
    sepia(${f.sepia})
    hue-rotate(${f.hue}deg)
    saturate(${f.saturation})
    brightness(${f.brightness})
  `;
}

/* ORIGINAL COLOR CYCLE */

function animateColors(now){
  if(transitionStart===null){
    transitionStart=now;
  }

  const elapsed=now-transitionStart;

  if(elapsed>=transitionDuration){
    const completed=Math.floor(
      elapsed/transitionDuration
    );

    currentStage=(
      currentStage+completed
    )%colorStages.length;

    transitionStart+=completed*transitionDuration;
  }

  const progress=smoothstep(
    (now-transitionStart)/transitionDuration
  );

  const nextStage=(
    currentStage+1
  )%colorStages.length;

  collage.style.filter=filterToCSS(
    interpolateFilter(
      colorStages[currentStage],
      colorStages[nextStage],
      progress
    )
  );

  requestAnimationFrame(animateColors);
}

function startColorCycle(){
  if(colorCycleStarted)return;

  colorCycleStarted=true;
  transitionStart=null;
  currentStage=0;

  collage.style.filter=filterToCSS(originalRed);

  requestAnimationFrame(animateColors);
}

/* ORIGINAL SMOOTH SCROLL REVEAL */

let targetProgress=0;
let currentProgress=0;
let lastFrameTime=0;
let imagesReady=false;

/* TRANSITION TO COLLAGE PAGE */

let handoffStarted=false;
let handoffTimer=null;

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function getScrollProgress(){
  const maxScroll=Math.max(
    1,
    document.documentElement.scrollHeight-
    window.innerHeight
  );

  return clamp(window.scrollY/maxScroll,0,1);
}

function updateVisuals(){

  const p=smoothstep(currentProgress);

  const reveal=smoothstep(
    clamp((p-.04)/.94,0,1)
  );

  collage.style.opacity=reveal;

  const collageScale=
    1.035-(reveal*.035);

  collage.style.transform=
    `scale(${collageScale})`;

  intro.style.opacity=1-reveal;

  const titleMove=-currentProgress*35;

  introTitle.style.transform=
    `translateY(${titleMove}px) scaleX(${titleScale})`;

  introTitle.style.opacity=
    1-smoothstep(
      clamp(currentProgress/.75,0,1)
    );

  const fullyRevealed=reveal>.995;

  intro.style.pointerEvents=
    fullyRevealed?"none":"auto";

  if(
    fullyRevealed &&
    imagesReady &&
    !colorCycleStarted
  ){
    startColorCycle();
  }

  /* PAGE HANDOFF */

  if(
    fullyRevealed &&
    imagesReady &&
    !handoffStarted
  ){
    handoffStarted=true;

    handoffTimer=setTimeout(()=>{
      try{
        sessionStorage.setItem(
          "integuments-from-page1",
          JSON.stringify({
            time:Date.now()
          })
        );
      }catch(error){}

      window.location.replace("page2.html");
    },450);
  }

  if(
    !fullyRevealed &&
    handoffStarted
  ){
    handoffStarted=false;

    if(handoffTimer!==null){
      clearTimeout(handoffTimer);
      handoffTimer=null;
    }
  }
}

/* ORIGINAL FRAME-BY-FRAME SCROLL SMOOTHING */

function render(now){
  if(!lastFrameTime){
    lastFrameTime=now;
  }

  const dt=Math.min(
    (now-lastFrameTime)/1000,
    .05
  );

  lastFrameTime=now;

  targetProgress=getScrollProgress();

  const smoothing=
    1-Math.exp(-dt*5.5);

  currentProgress+=
    (targetProgress-currentProgress)*smoothing;

  if(
    Math.abs(targetProgress-currentProgress)<.0001
  ){
    currentProgress=targetProgress;
  }

  updateVisuals();

  requestAnimationFrame(render);
}

/* ORIGINAL INITIAL SCROLL POSITION */

if("scrollRestoration" in history){
  history.scrollRestoration="manual";
}

window.scrollTo(0,0);

targetProgress=0;
currentProgress=0;

/* INITIAL RENDER */

fitIntroTitle();
updateVisuals();

document.fonts.ready.then(fitIntroTitle);

window.addEventListener(
  "resize",
  fitIntroTitle
);

/* ORIGINAL IMAGE PRELOADING */

Promise.all(
  images.map(waitForImage)
).then(()=>{

  imagesReady=true;

  collage.style.filter=
    filterToCSS(originalRed);

  collage.classList.add("is-ready");

  if(currentProgress>=.995){
    startColorCycle();
  }

});

/* START ORIGINAL SCROLL ANIMATION */

requestAnimationFrame(render);

</script>

</body>
</html>
