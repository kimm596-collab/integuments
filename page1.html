
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTEGUMENTS</title>

<style>
:root{
  --red:#E60000;
}

*{
  box-sizing:border-box;
}

html{
  margin:0;
  background:var(--red);
  scroll-behavior:auto;
  overscroll-behavior-y:none;
}

body{
  margin:0;
  min-height:240vh;
  min-height:240dvh;
  overflow-x:hidden;
  background:var(--red);
  overscroll-behavior-y:none;
}

.scene{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  isolation:isolate;
  background:var(--red);
}

/* RED INTRODUCTION */

.intro{
  position:absolute;
  inset:0;
  z-index:5;
  background:var(--red);
  opacity:1;
  pointer-events:none;
}

.title-position{
  position:absolute;
  left:0;
  right:0;
  bottom:3%;
}

.intro-title{
  position:relative;
  display:block;
  width:max-content;
  margin:0;
  padding:0;

  font-family:
    "Helvetica Neue Condensed Bold",
    "HelveticaNeue-CondensedBold",
    "Helvetica Neue",
    "Arial Narrow",
    Arial,
    sans-serif;

  font-weight:900;
  font-stretch:condensed;
  font-size:clamp(100px,18vw,400px);
  line-height:.82;
  letter-spacing:-.065em;
  white-space:nowrap;
  color:#a50000;

  text-shadow:
    0 -1px 0 rgba(75,0,0,.65),
    0 -2px 1px rgba(90,0,0,.32),
    -1px 0 0 rgba(100,0,0,.45),
    1px 0 0 rgba(255,35,35,.25),
    0 1px 0 rgba(255,48,48,.7),
    0 2px 1px rgba(255,45,45,.38),
    0 3px 3px rgba(90,0,0,.12);

  transform-origin:top left;
  user-select:none;
  will-change:transform,opacity;
}

/* COLLAGE REVEAL */

.collage{
  position:absolute;
  inset:0;
  z-index:10;
  overflow:hidden;
  background:var(--red);

  opacity:0;
  visibility:hidden;
  transform:scale(1.018);
  transform-origin:center;

  pointer-events:none;
  will-change:opacity,transform;
}

/* TWO COLOR LAYERS */

.color-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--red);
}

.color-layer.back{
  z-index:1;
  opacity:1;
}

.color-layer.front{
  z-index:2;
  opacity:0;
  will-change:opacity;
}

.tile{
  position:absolute;
  display:block;
  overflow:hidden;
  background:var(--red);
}

.tile img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  border:0;
  user-select:none;
  -webkit-user-drag:none;
}

/* CLICKABLE LINKS SIT ABOVE COLOR LAYERS */

.click-layer{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}

.click-tile{
  position:absolute;
  display:block;
  cursor:pointer;
  pointer-events:auto;
}

.click-tile:focus-visible{
  outline:2px solid white;
  outline-offset:-2px;
}

/* EXACT ORIGINAL COLLAGE LAYOUT */

.p01{left:0%;top:0%;width:12.2%;height:27.5%}
.p02{left:12.2%;top:0%;width:23.4%;height:27.5%}
.p03{left:35.6%;top:0%;width:12.2%;height:27.5%}
.p04{left:47.8%;top:0%;width:27.8%;height:27.5%}
.p05{left:75.6%;top:0%;width:24.4%;height:27.5%}

.p06{left:0%;top:27.5%;width:14.2%;height:33%}
.p07{left:14.2%;top:27.5%;width:14.2%;height:33%}
.p08{left:28.4%;top:27.5%;width:12.6%;height:33%}
.p09{left:41%;top:27.5%;width:12.8%;height:33%}
.p10{left:53.8%;top:27.5%;width:29.2%;height:33%}
.p11{left:83%;top:27.5%;width:17%;height:33%}

.p12{left:0%;top:60.5%;width:32.6%;height:39.5%}
.p13{left:32.6%;top:60.5%;width:14.6%;height:17%}
.p14{left:47.2%;top:60.5%;width:14.4%;height:17%}
.p15{left:61.6%;top:60.5%;width:15.6%;height:17%}
.p16{left:77.2%;top:60.5%;width:10.2%;height:17%}
.p17{left:87.4%;top:60.5%;width:12.6%;height:39.5%}

.p18{left:32.6%;top:77.5%;width:16%;height:22.5%}
.p19{left:48.6%;top:77.5%;width:10.5%;height:22.5%}
.p20{left:59.1%;top:77.5%;width:18.1%;height:22.5%}
.p21{left:77.2%;top:77.5%;width:10.2%;height:22.5%}

.p02 img,
.p04 img,
.p11 img{
  object-position:50% 45%;
}

@media(prefers-reduced-motion:reduce){
  .collage,
  .intro-title,
  .color-layer.front{
    will-change:auto;
  }
}
</style>
</head>

<body>

<main class="scene">

  <section class="intro" id="intro">
    <div class="title-position">
      <h1 class="intro-title" id="title">INTEGUMENTS</h1>
    </div>
  </section>

  <section class="collage" id="collage" aria-label="Photography catalogue">

    <div class="color-layer back" id="backLayer"></div>
    <div class="color-layer front" id="frontLayer"></div>

    <nav class="click-layer" id="clickLayer" aria-label="Photography projects"></nav>

  </section>

</main>

<script>
"use strict";

/* PHOTOGRAPHS AND LINKS */

const photographs=[
  ["guillem.jpg","page2-1.html"],
  ["body.jpg","page2-2.html"],
  ["jamie.jpg","page2-3.html"],
  ["abreale1.jpg","page2-4.html"],
  ["light1.jpg","page2-5.html"],
  ["annecy.jpg","page2-6.html"],
  ["paris.jpg","page2-7.html"],
  ["spiral.jpg","page2-8.html"],
  ["abreale2.jpg","page2-9.html"],
  ["soho.jpg","page2-10.html"],
  ["abreale3.jpg","page2-11.html"],
  ["abreale4.jpg","page2-12.html"],
  ["poles.jpg","page2-13.html"],
  ["light2.jpg","page2-15.html"],
  ["abreale6.jpg","page2-17.html"],
  ["amsterdam.jpg","page2-19.html"],
  ["nyc.jpg","page2-21.html"],
  ["morris.jpg","page2-14.html"],
  ["abreale5.jpg","page2-16.html"],
  ["ice.jpg","page2-18.html"],
  ["abreale7.jpg","page2-20.html"]
];

const RED=
  "grayscale(1) sepia(1) saturate(9) hue-rotate(320deg) brightness(.93) contrast(1.1)";

const BW=
  "grayscale(1) sepia(0) saturate(1) brightness(1.04)";

const BLUE=
  "grayscale(1) sepia(.30) hue-rotate(165deg) saturate(.85) brightness(1.02)";

const GREEN=
  "grayscale(1) sepia(.38) hue-rotate(95deg) saturate(.9) brightness(.99)";

const PURPLE=
  "grayscale(1) sepia(.30) hue-rotate(235deg) saturate(.75) brightness(1)";

const WARM=
  "grayscale(1) sepia(.25) hue-rotate(0deg) saturate(.75) brightness(.98)";

const colors=[
  RED,BW,RED,BLUE,RED,GREEN,
  RED,PURPLE,RED,WARM,RED
];

const intro=document.getElementById("intro");
const title=document.getElementById("title");
const collage=document.getElementById("collage");
const backLayer=document.getElementById("backLayer");
const frontLayer=document.getElementById("frontLayer");
const clickLayer=document.getElementById("clickLayer");

const clamp=(v,a=0,b=1)=>
  Math.max(a,Math.min(b,v));

const smoothstep=t=>{
  t=clamp(t);
  return t*t*(3-2*t);
};

let allReady=false;
let targetProgress=0;
let animatedProgress=0;
let titleScale=1;
let titleLeft=0;

let lastTime=0;
let colorStarted=false;
let colorIndex=0;
let colorTimeout=null;
let activeFront=false;
let colorTransitioning=false;

/* BUILD BOTH COLOR LAYERS */

function buildLayer(container){
  photographs.forEach(([src],index)=>{
    const tile=document.createElement("div");
    tile.className=`tile p${String(index+1).padStart(2,"0")}`;

    const img=document.createElement("img");
    img.src=src;
    img.alt="";
    img.loading="eager";
    img.decoding="async";

    tile.appendChild(img);
    container.appendChild(tile);
  });
}

buildLayer(backLayer);
buildLayer(frontLayer);

/* BUILD CLICKABLE AREAS */

photographs.forEach(([src,href],index)=>{
  const link=document.createElement("a");

  link.className=
    `click-tile p${String(index+1).padStart(2,"0")}`;

  link.href=href;
  link.setAttribute(
    "aria-label",
    `Open photograph ${index+1}`
  );

  clickLayer.appendChild(link);
});

/*
  Both layers share the same image URLs,
  allowing the browser to reuse resources.
*/

backLayer.style.filter=RED;
frontLayer.style.filter=RED;

/* PREPARE ALL 21 PHOTOGRAPHS */

function prepareImage(img){
  img.loading="eager";
  img.decoding="async";

  return new Promise(resolve=>{
    function finish(){
      if(!img.naturalWidth){
        resolve(false);
        return;
      }

      if(typeof img.decode==="function"){
        img.decode()
          .then(()=>resolve(true))
          .catch(()=>resolve(true));
      }else{
        resolve(true);
      }
    }

    if(img.complete){
      finish();
    }else{
      img.addEventListener("load",finish,{once:true});
      img.addEventListener(
        "error",
        ()=>resolve(false),
        {once:true}
      );
    }
  });
}

const allImages=[
  ...document.querySelectorAll(".color-layer img")
];

Promise.all(allImages.map(prepareImage)).then(results=>{
  if(!results.every(Boolean)){
    console.error(
      "INTEGUMENTS: Some photographs failed to load.",
      allImages.filter(img=>!img.naturalWidth).map(img=>img.src)
    );
    return;
  }

  allReady=true;
  collage.style.visibility="visible";
});

/* TITLE CENTERING */

function fitTitle(){
  title.style.transform="none";
  title.style.left="0px";

  const width=title.getBoundingClientRect().width;
  if(!width)return;

  const desired=window.innerWidth*.97;

  titleScale=desired/width;
  titleLeft=(window.innerWidth-desired)/2;

  title.style.left=titleLeft+"px";
}

/* SCROLL POSITION */

function readScroll(){
  const max=Math.max(
    1,
    document.documentElement.scrollHeight-
    window.innerHeight
  );

  targetProgress=clamp(window.scrollY/max);
}

window.addEventListener(
  "scroll",
  readScroll,
  {passive:true}
);

window.addEventListener(
  "resize",
  ()=>{
    fitTitle();
    readScroll();
  },
  {passive:true}
);

/*
  SMOOTH SCROLL CATCH-UP

  The animation does not jump directly to
  the scroll position after images load.
*/

function animate(time){
  const dt=lastTime?
    Math.min((time-lastTime)/1000,.05):
    .016;

  lastTime=time;

  const desired=allReady?targetProgress:0;

  const smoothing=1-Math.exp(-dt*5.5);

  animatedProgress+=
    (desired-animatedProgress)*smoothing;

  if(Math.abs(desired-animatedProgress)<.0001){
    animatedProgress=desired;
  }

  const reveal=smoothstep(
    clamp((animatedProgress-.035)/.91)
  );

  collage.style.opacity=String(reveal);

  collage.style.transform=
    `scale(${1.018-reveal*.018})`;

  intro.style.opacity=String(1-reveal);

  title.style.transform=
    `translateY(${-animatedProgress*35}px) scaleX(${titleScale})`;

  title.style.opacity=String(
    1-smoothstep(clamp(animatedProgress/.78))
  );

  const fullyVisible=
    allReady &&
    animatedProgress>=.995;

  collage.style.pointerEvents=
    fullyVisible?"auto":"none";

  if(fullyVisible){
    startColorCycle();
  }else{
    stopColorCycle();
  }

  requestAnimationFrame(animate);
}

/* OPACITY COLOR CROSSFADE */

function crossfadeToNextColor(){
  if(!colorStarted)return;

  colorIndex=(colorIndex+1)%colors.length;

  const nextColor=colors[colorIndex];

  /*
    Whichever layer is currently hidden
    receives the next color as a static
    filter. Only opacity is animated.
  */

  const incoming=activeFront?backLayer:frontLayer;
  const outgoing=activeFront?frontLayer:backLayer;

  incoming.style.transition="none";
  incoming.style.filter=nextColor;

  incoming.style.opacity="0";
  incoming.style.zIndex="2";

  outgoing.style.zIndex="1";
  outgoing.style.opacity="1";

  void incoming.offsetWidth;

  incoming.style.transition=
    "opacity 1800ms cubic-bezier(.45,0,.55,1)";

  incoming.style.opacity="1";

  colorTransitioning=true;

  colorTimeout=setTimeout(()=>{
    if(!colorStarted)return;

    outgoing.style.transition="none";
    outgoing.style.opacity="0";

    incoming.style.zIndex="1";
    outgoing.style.zIndex="2";

    activeFront=!activeFront;
    colorTransitioning=false;

    colorTimeout=setTimeout(
      crossfadeToNextColor,
      500
    );
  },1850);
}

function startColorCycle(){
  if(colorStarted)return;

  colorStarted=true;
  colorIndex=0;
  activeFront=false;

  backLayer.style.transition="none";
  frontLayer.style.transition="none";

  backLayer.style.filter=RED;
  frontLayer.style.filter=RED;

  backLayer.style.opacity="1";
  frontLayer.style.opacity="0";

  backLayer.style.zIndex="1";
  frontLayer.style.zIndex="2";

  colorTimeout=setTimeout(
    crossfadeToNextColor,
    1700
  );
}

function stopColorCycle(){
  if(!colorStarted)return;

  colorStarted=false;
  colorTransitioning=false;

  clearTimeout(colorTimeout);
  colorTimeout=null;

  colorIndex=0;
  activeFront=false;

  backLayer.style.transition="none";
  frontLayer.style.transition="none";

  backLayer.style.filter=RED;
  frontLayer.style.filter=RED;

  backLayer.style.opacity="1";
  frontLayer.style.opacity="0";

  backLayer.style.zIndex="1";
  frontLayer.style.zIndex="2";
}

/* INITIALIZATION */

if("scrollRestoration" in history){
  history.scrollRestoration="manual";
}

window.scrollTo(0,0);

fitTitle();
readScroll();

document.fonts.ready.then(fitTitle);

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden){
      stopColorCycle();
    }
  }
);

requestAnimationFrame(animate);

</script>

</body>
</html>
