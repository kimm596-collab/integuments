
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTEGUMENTS — Opening</title>

<style>
*{
  box-sizing:border-box;
}

html{
  margin:0;
  scroll-behavior:auto;
  overscroll-behavior-y:none;
}

body{
  margin:0;
  width:100%;
  min-height:220vh;
  min-height:220dvh;
  overflow-x:hidden;
  background:#E60000;
  overscroll-behavior-y:none;
}

.page1{
  position:fixed;
  inset:0;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#E60000;
  isolation:isolate;
}

/* ORIGINAL RED OPENING */

.intro{
  position:absolute;
  inset:0;
  z-index:5;
  background:#E60000;
  opacity:1;
  pointer-events:none;
  will-change:opacity;
}

/* ORIGINAL TITLE PLACEMENT */

.title-position{
  position:absolute;
  inset:auto 0 3% 0;
  pointer-events:none;
  overflow:visible;
}

.intro-title{
  position:relative;
  display:block;
  width:max-content;
  max-width:none;
  margin:0;
  padding:0;

  font-family:
    "Helvetica Neue Condensed Bold",
    "HelveticaNeue-CondensedBold",
    "Helvetica Neue",
    "Arial Narrow",
    Arial,
    sans-serif;

  font-weight:900;
  font-stretch:condensed;
  font-size:clamp(100px,18vw,400px);
  line-height:.82;
  letter-spacing:-.065em;
  white-space:nowrap;

  color:#a50000;

  text-shadow:
    0 -1px 0 rgba(75,0,0,.65),
    0 -2px 1px rgba(90,0,0,.32),
    -1px 0 0 rgba(100,0,0,.45),
    1px 0 0 rgba(255,35,35,.25),
    0 1px 0 rgba(255,48,48,.7),
    0 2px 1px rgba(255,45,45,.38),
    0 3px 3px rgba(90,0,0,.12);

  transform-origin:top left;
  user-select:none;
  will-change:transform,opacity;
}

/* PHOTOGRAPHY COLLAGE */

.collage{
  position:absolute;
  inset:0;
  z-index:10;
  width:100%;
  height:100%;
  overflow:hidden;
  visibility:visible;
  opacity:0;
  transform:scale(1.025);
  transform-origin:center;
  pointer-events:none;
  will-change:opacity,transform;
  background:#1e1e1e;
}

.tile{
  position:absolute;
  display:block;
  overflow:hidden;
}

.tile img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  border:0;
  user-select:none;
  -webkit-user-drag:none;
}

/* ORIGINAL 21 IMAGE POSITIONS */

.p01{left:0%;top:0%;width:12.2%;height:27.5%}
.p02{left:12.2%;top:0%;width:23.4%;height:27.5%}
.p03{left:35.6%;top:0%;width:12.2%;height:27.5%}
.p04{left:47.8%;top:0%;width:27.8%;height:27.5%}
.p05{left:75.6%;top:0%;width:24.4%;height:27.5%}

.p06{left:0%;top:27.5%;width:14.2%;height:33%}
.p07{left:14.2%;top:27.5%;width:14.2%;height:33%}
.p08{left:28.4%;top:27.5%;width:12.6%;height:33%}
.p09{left:41%;top:27.5%;width:12.8%;height:33%}
.p10{left:53.8%;top:27.5%;width:29.2%;height:33%}
.p11{left:83%;top:27.5%;width:17%;height:33%}

.p12{left:0%;top:60.5%;width:32.6%;height:39.5%}
.p13{left:32.6%;top:60.5%;width:14.6%;height:17%}
.p14{left:47.2%;top:60.5%;width:14.4%;height:17%}
.p15{left:61.6%;top:60.5%;width:15.6%;height:17%}
.p16{left:77.2%;top:60.5%;width:10.2%;height:17%}
.p17{left:87.4%;top:60.5%;width:12.6%;height:39.5%}

.p18{left:32.6%;top:77.5%;width:16%;height:22.5%}
.p19{left:48.6%;top:77.5%;width:10.5%;height:22.5%}
.p20{left:59.1%;top:77.5%;width:18.1%;height:22.5%}
.p21{left:77.2%;top:77.5%;width:10.2%;height:22.5%}

/* ORIGINAL IMAGE CROPPING */

.p02 img,
.p04 img,
.p11 img{
  object-position:50% 45%;
}

.p15 img,
.p21 img{
  object-position:center center;
}

@media (prefers-reduced-motion:reduce){
  .intro,
  .collage,
  .intro-title{
    will-change:auto;
  }
}
</style>
</head>

<body>

<main class="page1">

  <section class="intro" id="intro">
    <div class="title-position">
      <h1 class="intro-title" id="introTitle">
        INTEGUMENTS
      </h1>
    </div>
  </section>

  <div class="collage" id="collage">

    <div class="tile p01">
      <img src="guillem.jpg" alt="Guillem" decoding="async">
    </div>

    <div class="tile p02">
      <img src="body.jpg" alt="Body" decoding="async">
    </div>

    <div class="tile p03">
      <img src="jamie.jpg" alt="Jamie" decoding="async">

    <div class="tile p04">
      <img src="abreale1.jpg" alt="Abreale 1" decoding="async">
    </div>

    <div class="tile p05">

    </div>

    <div class="tile p06">
      <img src="annecy.jpg" alt="Annecy" decoding="async">
    </div>

    <div class="tile p07">
      <img src="paris.jpg" alt="Paris" decoding="async">
    </div>

    <div class="tile p08">
      <img src="spiral.jpg" alt="Spiral" decoding="async">

    <div class="tile p16">

    </div>

    </div>

  </div>

</main>

<script>
"use strict";

const intro=document.getElementById("intro");
const title=document.getElementById("introTitle");
const collage=document.getElementById("collage");
const images=[...collage.querySelectorAll("img")];

let titleScale=1;
let titleLeft=0;
let scrollFrame=0;
let redirectTimer=null;
let navigating=false;

const clamp=(v,min=0,max=1)=>
  Math.max(min,Math.min(max,v));

function smoothstep(t){
  t=clamp(t);
  return t*t*(3-2*t);
}

/* CENTER THE ACTUAL RENDERED TITLE */

function fitTitle(){
  title.style.transform="none";
  title.style.left="0px";

  const width=title.getBoundingClientRect().width;
  if(!width)return;

  const desired=window.innerWidth*.97;

  titleScale=desired/width;
  titleLeft=(window.innerWidth-desired)/2;

  title.style.left=titleLeft+"px";

  updateScroll();
}

/* DIRECT SCROLL RESPONSE — NO DELAYED SMOOTHING */

function getProgress(){
  const maxScroll=Math.max(
    1,
    document.documentElement.scrollHeight-
    window.innerHeight
  );

  return clamp(window.scrollY/maxScroll);
}

function updateScroll(){
  scrollFrame=0;

  if(navigating)return;

  const progress=getProgress();

  /* Reveal begins during scrolling, not afterward. */

  const reveal=smoothstep(
    clamp((progress-.035)/.90)
  );

  intro.style.opacity=String(1-reveal);
  collage.style.opacity=String(reveal);

  const scale=1.025-(reveal*.025);

  collage.style.transform=`scale(${scale})`;

  title.style.transform=
    `translateY(${-progress*35}px) scaleX(${titleScale})`;

  title.style.opacity=String(
    1-smoothstep(clamp(progress/.76))
  );

  /*
    Navigate only after reaching the bottom.
    Cancel navigation if the visitor scrolls back.
  */

  if(progress>=.998){
    if(redirectTimer===null){
      redirectTimer=setTimeout(
        goToPage2,
        1050
      );
    }
  }else{
    if(redirectTimer!==null){
      clearTimeout(redirectTimer);
      redirectTimer=null;
    }
  }
}

function requestScrollUpdate(){
  if(scrollFrame)return;

  scrollFrame=requestAnimationFrame(updateScroll);
}

/* PAGE 2 HANDOFF */

function goToPage2(){
  if(navigating)return;

  if(getProgress()<.998){
    redirectTimer=null;
    return;
  }

  navigating=true;

  try{
    sessionStorage.setItem(
      "integuments-from-page1",
      JSON.stringify({
        time:Date.now()
      })
    );
  }catch(error){}

  window.location.replace("page2.html");
}

/* RESET INITIAL SCROLL */

if("scrollRestoration" in history){
  history.scrollRestoration="manual";
}

window.scrollTo(0,0);

window.addEventListener(
  "scroll",
  requestScrollUpdate,
  {passive:true}
);

window.addEventListener(
  "resize",
  fitTitle,
  {passive:true}
);

window.addEventListener(
  "pageshow",
  ()=>{
    navigating=false;

    if(redirectTimer!==null){
      clearTimeout(redirectTimer);
      redirectTimer=null;
    }

    window.scrollTo(0,0);
    fitTitle();
  }
);

/* PREPARE IMAGES FOR THE COLLAGE */

images.forEach(img=>{
  img.loading="eager";
  img.decoding="async";
});

/*
  The scroll reveal does not wait for every
  image to load. This prevents image loading
  from blocking the page transition.
*/

fitTitle();
updateScroll();

document.fonts.ready.then(fitTitle);

</script>

</body>
</html>
