<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>INTEGUMENTS — 2-17</title>

<style>

*{box-sizing:border-box}

html{background:#000;scroll-behavior:auto}

body{margin:0;background:#000;color:#b90000;overflow-x:hidden;font-family:Arial,sans-serif}

.site-logo{position:fixed;top:42px;right:34px;width:220px;z-index:3000;display:block}

.site-logo img{display:block;width:100%;height:auto}

.opening{position:relative;background:#000}

.text-group{position:relative;width:min(760px,76vw);margin:0 auto;padding-top:58vh;padding-bottom:12vh;opacity:0;pointer-events:none;will-change:opacity}

.text-motion{position:relative;width:100%;isolation:isolate;overflow:visible}

.text-original{position:relative;z-index:10;display:block;width:100%;height:auto;transform-origin:center;animation:flowerBreathe 7s ease-in-out infinite alternate}

@keyframes flowerBreathe{

0%{transform:translate(-3px,3px) rotate(-.5deg) scale(.995)}

50%{transform:translate(4px,-5px) rotate(.6deg) scale(1.015)}

100%{transform:translate(-2px,-9px) rotate(-.3deg) scale(1.005)}

}

.word-shadows{position:absolute;inset:0;z-index:12;overflow:visible;pointer-events:none;contain:layout style}

.word-shadow{position:absolute;pointer-events:none;will-change:transform,opacity;transform-origin:center;animation:wordFloat var(--duration) ease-in-out infinite alternate;animation-delay:var(--delay);filter:drop-shadow(0 0 3px rgba(255,0,0,.65))}

.word-shadow img{display:block;width:100%;height:100%}

.word-shadow.secondary{animation-name:wordFloatSecondary;filter:drop-shadow(0 0 7px rgba(255,0,0,.5))}

.word-shadow.depth{animation-name:wordFloatDepth;filter:blur(.35px) drop-shadow(0 0 10px rgba(255,0,0,.4))}

@keyframes wordFloat{

0%{transform:translate(calc(var(--dx)*-.8),calc(var(--dy)*-.8)) scale(.98);opacity:.35}

50%{transform:translate(var(--dx),var(--dy)) scale(1.07);opacity:.82}

100%{transform:translate(calc(var(--dx)*-.9),calc(var(--dy)*.85)) scale(1.03);opacity:.46}

}

@keyframes wordFloatSecondary{

0%{transform:translate(calc(var(--dx)*.9),calc(var(--dy)*-1.1)) scale(1.04);opacity:.28}

50%{transform:translate(calc(var(--dx)*-1.5),calc(var(--dy)*1.1)) scale(.96);opacity:.66}

100%{transform:translate(calc(var(--dx)*1.2),calc(var(--dy)*-.8)) scale(1.08);opacity:.35}

}

@keyframes wordFloatDepth{

0%{transform:translate(calc(var(--dx)*-1.6),calc(var(--dy)*.9)) scale(1.12);opacity:.18}

50%{transform:translate(calc(var(--dx)*2),calc(var(--dy)*-1.5)) scale(.93);opacity:.48}

100%{transform:translate(calc(var(--dx)*-1.2),calc(var(--dy)*1.7)) scale(1.15);opacity:.28}

}

/* Black space around readable text */

.readability-mask{position:absolute;inset:0;z-index:30;pointer-events:none;background:#000;opacity:1;-webkit-mask-image:none;mask-image:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}

.readability-text{position:absolute;inset:0;z-index:31;width:100%;height:100%;pointer-events:none;display:block;object-fit:fill;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}

.film-section{position:relative;height:72dvh;overflow:hidden;background:#000}

.film-stage{position:absolute;inset:0;perspective:1000px;perspective-origin:50% 50%;overflow:hidden;isolation:isolate;opacity:0;transition:opacity 850ms ease}

.film-stage.revealed{opacity:1}

.film-item{position:absolute;top:22dvh;left:50%;width:max-content;height:300px;transform-origin:center;backface-visibility:hidden;will-change:transform,opacity,filter;pointer-events:none}

.film-item img{display:block;width:auto;height:100%;max-width:none;object-fit:contain;backface-visibility:hidden}

html.film-locked{scroll-behavior:auto!important;overflow:hidden!important;overscroll-behavior:none}

body.film-locked{overflow:hidden!important;overscroll-behavior:none;touch-action:none}

.return-scene{position:fixed;inset:0;z-index:5000;overflow:hidden;background:transparent;opacity:0;visibility:hidden;pointer-events:none}

.return-scene.active{visibility:visible;opacity:1}

.return-catalogue{position:absolute;inset:0;opacity:0;will-change:opacity}

.return-tile{position:absolute;overflow:hidden;background:#000}

.return-tile img{display:block;width:100%;height:100%;object-fit:cover}

.return-flight{position:fixed;left:0;top:0;z-index:5100;overflow:hidden;pointer-events:none;transform-origin:top left;will-change:transform,width,height}

.return-flight img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}

@media(max-width:700px){

.site-logo{top:26px;right:20px;width:170px}

.text-group{width:90vw;padding-top:62vh;padding-bottom:12vh}

.film-section{height:75dvh}

.film-item{top:25dvh;height:200px}

}

@media(prefers-reduced-motion:reduce){

.text-original,.word-shadow{animation:none}

}

</style>

</head>

<body>



<a href="index.html" class="site-logo" aria-label="Home">

<img src="integuments-red-logo.png" alt="INTEGUMENTS">

</a>



<section class="opening" id="opening">

<div class="text-group" id="poem-text">

<div class="text-motion">

<img src="2-17 text.png" class="text-original" id="poem-original" alt="Flower-shaped poem">

<div class="word-shadows" id="poem-shadows" aria-hidden="true"></div>

<div class="readability-mask" id="readability-mask" aria-hidden="true"></div>

<img src="2-17 text.png" class="readability-text" id="readability-text" alt="" aria-hidden="true">

</div>

</div>

</section>



<section class="film-section" id="film-section">

<div class="film-stage" id="film-stage"></div>

</section>



<div class="return-scene" id="return-scene">

<div class="return-catalogue" id="return-catalogue"></div>

</div>



<script>

function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}

function smoothstep(v){const t=clamp(v);return t*t*(3-2*t)}

function easeInOutCubic(t){t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

function lerp(a,b,t){return a+(b-a)*t}

function variation(n,o){const v=Math.sin(n*12.9898+o*78.233)*43758.5453;return v-Math.floor(v)}



const opening=document.getElementById('opening');

const poemText=document.getElementById('poem-text');

const poemOriginal=document.getElementById('poem-original');

const poemShadows=document.getElementById('poem-shadows');

const section=document.getElementById('film-section');

const stage=document.getElementById('film-stage');

const returnScene=document.getElementById('return-scene');

const returnCatalogue=document.getElementById('return-catalogue');

const readabilityMask=document.getElementById('readability-mask');

const readabilityText=document.getElementById('readability-text');



let fragmentCache=null,maskURL=null;



function analyzeFlower(){

if(!poemOriginal.complete||!poemOriginal.naturalWidth)return [];



const W=poemOriginal.naturalWidth,H=poemOriginal.naturalHeight;



/* Downscaled analysis improves Safari performance */

const analysisScale=Math.min(1,1000/W,1000/H);

const aw=Math.max(1,Math.round(W*analysisScale));

const ah=Math.max(1,Math.round(H*analysisScale));



const canvas=document.createElement('canvas');

canvas.width=aw;

canvas.height=ah;

const ctx=canvas.getContext('2d',{willReadFrequently:true});

ctx.drawImage(poemOriginal,0,0,aw,ah);



let pixels;

try{

pixels=ctx.getImageData(0,0,aw,ah).data;

}catch(e){

console.warn(e);

return [];

}



const red=new Uint8Array(aw*ah);

for(let i=0;i<red.length;i++){

const j=i*4,r=pixels[j],g=pixels[j+1],b=pixels[j+2],a=pixels[j+3];

if(a>35&&r>45&&r>g*1.35&&r>b*1.35)red[i]=1;

}



/* Protected reading areas inside the three petals */

const zones=[

{x:.20,y:.35,w:.27,h:.36},

{x:.43,y:.13,w:.21,h:.43},

{x:.69,y:.37,w:.23,h:.34}

];



/* Generate a mask to restore clean readable text */

const mask=document.createElement('canvas');

mask.width=aw;

mask.height=ah;

const mc=mask.getContext('2d');

mc.fillStyle='#fff';



for(const z of zones){

const cx=(z.x+z.w/2)*aw;

const cy=(z.y+z.h/2)*ah;

const rx=z.w*aw/2;

const ry=z.h*ah/2;



mc.save();

mc.translate(cx,cy);

mc.scale(rx,ry);

mc.beginPath();

mc.arc(0,0,1,0,Math.PI*2);

mc.restore();

mc.fill();

}



maskURL=mask.toDataURL('image/png');

readabilityMask.style.webkitMaskImage=`url("${maskURL}")`;

readabilityMask.style.maskImage=`url("${maskURL}")`;

readabilityText.style.webkitMaskImage=`url("${maskURL}")`;

readabilityText.style.maskImage=`url("${maskURL}")`;



/* Extract only red characters; remove black PNG backgrounds */

const clean=document.createElement('canvas');

clean.width=aw;

clean.height=ah;

const cc=clean.getContext('2d');

const data=cc.createImageData(aw,ah);



for(let i=0;i<red.length;i++){

if(!red[i])continue;

const j=i*4;

data.data[j]=pixels[j];

data.data[j+1]=pixels[j+1];

data.data[j+2]=pixels[j+2];

data.data[j+3]=pixels[j+3];

}

cc.putImageData(data,0,0);



/* Capture moving fragments across the flower outline */

const tile=Math.max(18,Math.round(aw/23));

const fragments=[];



for(let y=0;y<ah;y+=tile){

for(let x=0;x<aw;x+=tile){

const w=Math.min(tile,aw-x);

const h=Math.min(tile,ah-y);

let count=0;



for(let yy=y;yy<y+h;yy+=2){

for(let xx=x;xx<x+w;xx+=2){

count+=red[yy*aw+xx];

}

}

if(count<3)continue;



const nx=(x+w/2)/aw;

const ny=(y+h/2)/ah;



/* Keep floating letters away from readable interiors */

const inText=zones.some(z=>{

const dx=(nx-(z.x+z.w/2))/(z.w/2);

const dy=(ny-(z.y+z.h/2))/(z.h/2);

return dx*dx+dy*dy<1.20;

});

if(inText)continue;



const pad=3;

const cx=Math.max(0,x-pad);

const cy=Math.max(0,y-pad);

const cw=Math.min(aw,cx+w+pad*2)-cx;

const ch=Math.min(ah,cy+h+pad*2)-cy;



const piece=document.createElement('canvas');

piece.width=cw;

piece.height=ch;

piece.getContext('2d').drawImage(clean,cx,cy,cw,ch,0,0,cw,ch);



fragments.push({

x:cx/analysisScale,

y:cy/analysisScale,

w:cw/analysisScale,

h:ch/analysisScale,

src:piece.toDataURL('image/png')

});

}

}

return fragments;

}



function buildWordShadows(){

if(!poemOriginal.complete||!poemOriginal.naturalWidth)return;

if(!fragmentCache)fragmentCache=analyzeFlower();



const scale=poemOriginal.getBoundingClientRect().width/poemOriginal.naturalWidth;

if(scale<=0)return;

const batch=document.createDocumentFragment();



fragmentCache.forEach((f,index)=>{

/* Two floating layers for smoother animation */

for(let layer=0;layer<2;layer++){

const el=document.createElement('div');

el.className='word-shadow'+(layer===1?' secondary':'');

el.style.left=f.x*scale+'px';

el.style.top=f.y*scale+'px';

el.style.width=f.w*scale+'px';

el.style.height=f.h*scale+'px';



const img=document.createElement('img');

img.src=f.src;

img.alt='';

img.draggable=false;

el.appendChild(img);



const seed=index*2+layer;

const dx=(variation(seed,1)>.5?1:-1)*(22+variation(seed,3)*25);

const dy=(variation(seed,2)>.5?1:-1)*(16+variation(seed,4)*25);

const duration=4+variation(seed,5)*4;



el.style.setProperty('--dx',dx+'px');

el.style.setProperty('--dy',dy+'px');

el.style.setProperty('--duration',duration+'s');

el.style.setProperty('--delay',(-variation(seed,6)*duration)+'s');

batch.appendChild(el);

}

});

poemShadows.replaceChildren(batch);

}



poemOriginal.addEventListener('load',()=>{

fragmentCache=null;

buildWordShadows();

});



if(poemOriginal.complete&&poemOriginal.naturalWidth){

buildWordShadows();

}



/* Smooth poem entrance and scroll fade */

let entryStart=null,entryOpacity=0;



function animateEntry(now){

if(entryStart===null)entryStart=now;

entryOpacity=smoothstep((now-entryStart)/1200);

requestScrollUpdate();

if(entryOpacity<1)requestAnimationFrame(animateEntry);

}



function updateTextScroll(){

const vh=innerHeight;

const bottom=opening.offsetTop+opening.offsetHeight;

const start=bottom-vh*.75;

const end=bottom-vh*.30;

const fade=smoothstep((scrollY-start)/(end-start));

poemText.style.opacity=entryOpacity*(1-fade);

return fade;

}



/* All 21 images */

const images=[

'guillem.jpg','body.jpg','jamie.jpg','abreale1.jpg',

'light1.jpg','annecy.jpg','paris.jpg','spiral.jpg',

'abreale2.jpg','soho.jpg','abreale3.jpg','abreale4.jpg',

'poles.jpg','light2.jpg','abreale5.jpg','amsterdam.jpg',

'morris.jpg','abreale6.jpg','ice.jpg','abreale7.jpg','nyc.jpg'

];



const cards=images.map(name=>{

const div=document.createElement('div');

div.className='film-item';

const img=document.createElement('img');

img.src=name;

img.alt=name;

img.draggable=false;

div.appendChild(img);

stage.appendChild(div);

return div;

});



const total=cards.length;

const FOCUS_INDEX=16;

const FOCUS_IMAGE='morris.jpg';

const RUN_DURATION=3200;

const EXPAND_DURATION=1800;

const HOLD_DURATION=300;

const RETURN_DURATION=2000;



let animationStarted=false;

let animationStart=null;

let currentPosition=FOCUS_INDEX;

let finished=false;

let expanding=false;

let expansionProgress=0;

let scrollLocked=false;

let returning=false;



window.addEventListener('wheel',e=>{

if(scrollLocked)e.preventDefault();

},{passive:false,capture:true});



window.addEventListener('touchmove',e=>{

if(scrollLocked)e.preventDefault();

},{passive:false,capture:true});



window.addEventListener('keydown',e=>{

if(scrollLocked&&[

'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',

'PageUp','PageDown','Home','End',' ','Spacebar'

].includes(e.key))e.preventDefault();

},{capture:true});



function getDistance(i,p){

let d=i-p;

while(d<-total/2)d+=total;

while(d>total/2)d-=total;

return d;

}



function updateRevealMask(img,d){

const width=45*smoothstep((d+.35)/1.65);

if(width<.1){

img.style.webkitMaskImage='none';

img.style.maskImage='none';

return;

}

const gradient=`linear-gradient(to right,

transparent 0%,

rgba(0,0,0,.12) ${width*.18}%,

rgba(0,0,0,.32) ${width*.40}%,

rgba(0,0,0,.62) ${width*.68}%,

rgba(0,0,0,.85) ${width*.88}%,

black ${width}%,black 100%)`;

img.style.webkitMaskImage=gradient;

img.style.maskImage=gradient;

}



function render(position,finalMode=false,expansion=0){

currentPosition=position;

const mobile=innerWidth<=700;

const spacing=mobile?112:175;

const baseHeight=mobile?200:300;



cards.forEach((card,i)=>{

const d=getDistance(i,finalMode?FOCUS_INDEX:position);

const a=Math.abs(d);

const x=d*spacing;

const y=Math.min(a*a*3.5,65);

const z=-a*125;

const ry=clamp(-d*15,-65,65);

const s=Math.max(.55,1-a*.055);

const op=clamp(1-a*.095);

const b=clamp(1-a*.085,.22,1);

const img=card.querySelector('img');



card.style.height=baseHeight+'px';

updateRevealMask(img,d);

card.style.opacity=op;

card.style.filter=`brightness(${b})`;

card.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg) scale(${s})`;

card.style.zIndex=String(1000-Math.round(a*10));

card.style.visibility=op<=0?'hidden':'visible';

});



if(finalMode){

const focus=cards[FOCUS_INDEX];

const img=focus.querySelector('img');

const e=easeInOutCubic(expansion);

const sh=section.clientHeight;

const cy=mobile?innerHeight*.25:innerHeight*.22;

const safe=Math.max(100,Math.min(sh*.70,cy*2-24,(sh-cy)*2-24));

const fh=mobile?Math.min(safe,380):Math.min(safe,476);



focus.style.height=(baseHeight+(fh-baseHeight)*e)+'px';

img.style.webkitMaskImage='none';

img.style.maskImage='none';

focus.style.transform='translate(-50%,-50%) translate3d(0,0,0) rotateY(0deg) scale(1)';

focus.style.opacity='1';

focus.style.filter='brightness(1)';

focus.style.zIndex='1100';

focus.style.visibility='visible';

}

}



render(FOCUS_INDEX);



/* Smoothly align the film to the same viewport position as the other pages.
   Use a fixed scroll anchor instead of locking midway through a wheel gesture. */

let filmAligning=false;

function lockFilmScroll(){

if(scrollLocked)return;

scrollLocked=true;

document.documentElement.classList.add('film-locked');

document.body.classList.add('film-locked');

}



function alignFilmAndStart(){

if(animationStarted||filmAligning)return;

filmAligning=true;

/* Match the film section's top edge to the viewport's top edge.
   This keeps its original 22dvh (25dvh mobile) card position. */

const target=Math.max(0,section.getBoundingClientRect().top+window.scrollY);

const startY=window.scrollY;

const distance=target-startY;

const duration=Math.min(460,Math.max(200,Math.abs(distance)*.65));

const start=performance.now();

function settle(now){

const t=clamp((now-start)/duration);

const eased=easeInOutCubic(t);

window.scrollTo(0,startY+distance*eased);

if(t<1){

requestAnimationFrame(settle);

}else{

filmAligning=false;

startFilmAnimation();

}

}

requestAnimationFrame(settle);

}



function startFilmAnimation(){

if(animationStarted)return;

animationStarted=true;

lockFilmScroll();

stage.classList.add('revealed');

animationStart=performance.now();

requestAnimationFrame(animateFilm);

}



function animateFilm(now){

const elapsed=now-animationStart;



if(elapsed<RUN_DURATION){

render(FOCUS_INDEX+(elapsed/RUN_DURATION)*total);

requestAnimationFrame(animateFilm);

return;

}



expanding=true;

expansionProgress=clamp((elapsed-RUN_DURATION)/EXPAND_DURATION);

render(FOCUS_INDEX+total,true,expansionProgress);



if(expansionProgress<1){

requestAnimationFrame(animateFilm);

}else{

finished=true;

render(FOCUS_INDEX+total,true,1);

setTimeout(startSeamlessReturn,HOLD_DURATION);

}

}



/* Catalogue positions */

const catalogueTiles=[

['guillem.jpg',0,0,12.2,27.5],

['body.jpg',12.2,0,23.4,27.5],

['jamie.jpg',35.6,0,12.2,27.5],

['abreale1.jpg',47.8,0,27.8,27.5],

['light1.jpg',75.6,0,24.4,27.5],

['annecy.jpg',0,27.5,14.2,33],

['paris.jpg',14.2,27.5,14.2,33],

['spiral.jpg',28.4,27.5,12.6,33],

['abreale2.jpg',41,27.5,12.8,33],

['soho.jpg',53.8,27.5,29.2,33],

['abreale3.jpg',83,27.5,17,33],

['abreale4.jpg',0,60.5,32.6,39.5],

['poles.jpg',32.6,60.5,14.6,17],

['light2.jpg',47.2,60.5,14.4,17],

['abreale6.jpg',61.6,60.5,15.6,17],

['amsterdam.jpg',77.2,60.5,10.2,17],

['nyc.jpg',87.4,60.5,12.6,39.5],

['morris.jpg',32.6,77.5,16,22.5],

['abreale5.jpg',48.6,77.5,10.5,22.5],

['ice.jpg',59.1,77.5,18.1,22.5],

['abreale7.jpg',77.2,77.5,10.2,22.5]

];



catalogueTiles.forEach(([src,x,y,w,h])=>{

const tile=document.createElement('div');

tile.className='return-tile';

tile.style.left=x+'%';

tile.style.top=y+'%';

tile.style.width=w+'%';

tile.style.height=h+'%';



if(src!==FOCUS_IMAGE){

const img=document.createElement('img');

img.src=src;

img.alt='';

if(['body.jpg','abreale1.jpg','abreale3.jpg'].includes(src)){

img.style.objectPosition='50% 45%';

}

tile.appendChild(img);

}

returnCatalogue.appendChild(tile);

});



/* Seamless morris.jpg return */

function startSeamlessReturn(){

if(returning)return;

returning=true;



const focus=cards[FOCUS_INDEX];

const origin=focus.querySelector('img').getBoundingClientRect();

const dest={

left:innerWidth*.326,

top:innerHeight*.775,

width:innerWidth*.16,

height:innerHeight*.225

};



const flying=document.createElement('div');

flying.className='return-flight';

const img=document.createElement('img');

img.src=FOCUS_IMAGE;

img.alt='';

flying.appendChild(img);

returnScene.appendChild(flying);

flying.style.width=origin.width+'px';

flying.style.height=origin.height+'px';

flying.style.transform=`translate3d(${origin.left}px,${origin.top}px,0)`;

returnScene.classList.add('active');

focus.style.visibility='hidden';



const start=performance.now();



function tick(now){

const t=clamp((now-start)/RETURN_DURATION);

const e=easeInOutCubic(t);

stage.style.opacity=String(1-smoothstep(t/.65));

returnCatalogue.style.opacity=String(smoothstep((t-.10)/.70));



const x=lerp(origin.left,dest.left,e);

const y=lerp(origin.top,dest.top,e)-Math.sin(Math.PI*t)*38;

const w=lerp(origin.width,dest.width,e);

const h=lerp(origin.height,dest.height,e);



flying.style.width=w+'px';

flying.style.height=h+'px';

flying.style.transform=`translate3d(${x}px,${y}px,0)`;



if(t<1){

requestAnimationFrame(tick);

}else{

try{

sessionStorage.removeItem('integuments-return-flight');

sessionStorage.setItem('integuments-seamless-arrival',JSON.stringify({

image:FOCUS_IMAGE,

time:Date.now()

}));

}catch(e){}

location.replace('page2.html');

}

}

requestAnimationFrame(tick);

}



/* Throttled scroll handling */

let scrollPending=false;



function requestScrollUpdate(){

if(scrollPending)return;

scrollPending=true;

requestAnimationFrame(()=>{

scrollPending=false;

updateScrollEffects();

});

}



function updateScrollEffects(){

if(scrollLocked||filmAligning)return;

const fade=updateTextScroll();

const rect=section.getBoundingClientRect();

if(fade>=.999&&rect.top<=innerHeight*.90){

alignFilmAndStart();

}

}



window.addEventListener('scroll',requestScrollUpdate,{passive:true});



window.addEventListener('load',()=>{

buildWordShadows();

requestAnimationFrame(animateEntry);

requestScrollUpdate();

});



let resizeTimer;

window.addEventListener('resize',()=>{

clearTimeout(resizeTimer);

resizeTimer=setTimeout(buildWordShadows,180);
